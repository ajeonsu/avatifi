<style>
/* 色と字（HubSpot の作りにならって、白い面・薄い灰色の地・はっきりした罫。色は Avatifi の紫） */
:root{
  color-scheme:light;   /* 明るい画面だけ（HubSpot と同じ）。暗い設定の端末でも、選ぶ欄・日付の欄を明るく出す */
  --bg:#f3f5f9;--surface:#ffffff;--surface-2:#f7f8fb;--line:#e1e5ec;--line-2:#cbd2dd;
  --ink:#1c2433;--ink2:#394355;--muted:#667085;--faint:#98a1b2;
  --accent:#5a3fd8;--accent2:#4930c0;--accent-weak:#efebfe;--accent-line:#d6cdfb;
  --nav:#1b1e2c;--nav2:#272b3d;--nav-ink:#c6cad8;--nav-muted:#80869c;
  --ok:#12784f;--ok-weak:#e2f4eb;--teal:#0e6f78;--teal-weak:#e0f3f4;--warn:#8f5d0c;--warn-weak:#fdf1d9;--late:#b3261e;--late-weak:#fde7e6;
  --info:#1d55c2;--info-weak:#e3ebfd;--pink:#a3326b;--pink-weak:#fce8f1;--gray:#5f6675;--gray-weak:#eef0f4;
  --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);--shadow-lg:0 16px 48px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans JP","Yu Gothic UI","Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
[v-cloak]{display:none}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.grow{flex:1}
.small{font-size:12px}

/* 全体の枠：左のメニュー・上の帯・中身 */
.shell{display:flex;min-height:100vh}
.nav{width:220px;flex:0 0 220px;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-size:15px;flex:0 0 30px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--nav-muted);letter-spacing:0}
.navgrp{padding:2px 10px}
.navgrp h6{margin:12px 8px 4px;font-size:11px;font-weight:600;color:var(--nav-muted);letter-spacing:.08em}
.navgrp button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--nav-ink);padding:8px 10px;border-radius:8px;text-align:left;font-size:14px}
.navgrp button:hover{background:var(--nav2);color:#fff}
.navgrp button.on{background:var(--accent);color:#fff;font-weight:700}
.navgrp .ico{width:18px;text-align:center;opacity:.9}
.nav-foot{margin-top:auto;padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--nav-muted)}
.nav-foot b{color:#fff}
.nav-foot a{color:var(--nav-ink)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:25;background:var(--surface);border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;gap:12px;padding:0 20px}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);padding:0 12px 0 34px}
.gsearch input:focus{background:#fff;border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-weak)}

.gsearch .res{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);max-height:60vh;overflow:auto;z-index:40}
.gsearch .res button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:9px 14px;border-bottom:1px solid var(--line)}
.gsearch .res button:hover{background:var(--accent-weak)}
.gsearch .res .k{font-size:11px;color:var(--muted);min-width:44px}
.topbar .who{font-size:13px;color:var(--muted);white-space:nowrap}
.mihon{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-weak);border:1px solid #efd7a3;border-radius:999px;padding:3px 10px;white-space:nowrap}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:0 0 16px}

@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.page{padding:20px 24px 56px;width:100%;max-width:1680px}

/* ページの頭・見え方のタブ・絞り込み */
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.page-head h1{margin:0;font-size:22px;font-weight:800;line-height:1.3;text-wrap:balance}
.page-head .count{color:var(--muted);font-size:14px;margin-left:8px;font-weight:500}
.page-head .sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.page-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
.vtabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.vtabs button:hover{color:var(--ink)}
.vtabs button.on{color:var(--accent2);border-bottom-color:var(--accent)}
.vtabs .n{font-size:11px;background:var(--gray-weak);color:var(--gray);border-radius:999px;padding:1px 7px;font-weight:700}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.f{height:34px;border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:0 10px;min-width:0}
.f:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
input.f.q{min-width:220px}
.btn{height:34px;border:1px solid var(--line-2);background:#fff;color:var(--ink);border-radius:8px;padding:0 14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#aeb7c6;background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--late);border-color:#efc4c1}
.btn.small{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:#fff;height:34px}
.seg button{border:0;background:none;padding:0 12px;font-weight:600;color:var(--muted)}
.seg button + button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--accent-weak);color:var(--accent2)}
.monthnav{display:inline-flex;align-items:center;gap:6px}
.monthnav .lbl{font-weight:700;min-width:96px;text-align:center}

/* 面・数字の札 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card > h3{font-size:14px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}

.meter{height:6px;background:var(--gray-weak);border-radius:6px;margin-top:8px;overflow:hidden}

.items{list-style:none;margin:0;padding:0}
.items li{border-bottom:1px solid var(--line)}

.items .t1{font-weight:700}
.items .t2{color:var(--muted);font-size:12px}
.items .r{margin-left:auto;text-align:right;white-space:nowrap;font-size:12px;color:var(--muted)}
.empty{padding:16px;color:var(--muted);font-size:13px}
.note{background:var(--accent-weak);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink2);margin-bottom:12px}
.note.warn{background:var(--warn-weak)}

/* 札（段階・状態） */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--gray-weak);color:var(--gray);white-space:nowrap;border:0}
button.pill{cursor:pointer}
.st-リード{background:var(--gray-weak);color:var(--gray)}
.st-アポ{background:var(--info-weak);color:var(--info)}
.st-着座{background:var(--accent-weak);color:var(--accent2)}
.st-見込み{background:var(--warn-weak);color:var(--warn)}

.ps-過ぎた（未確認）{background:var(--late-weak);color:var(--late)}
.ps-予定{background:var(--info-weak);color:var(--info)}

.ps-日付が出ない{background:var(--warn-weak);color:var(--warn)}

.fs-一部{background:var(--warn-weak);color:var(--warn)}

.w-営業{background:var(--warn-weak);color:var(--warn)}

.cardmore{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px 16px}
.cardmore .ocr{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--ink2);max-height:200px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:3px}
.prop-hint{font-size:11px;color:var(--faint);margin-top:3px}
.prop.compact{padding:0;margin:0}
.prop.compact .prop-v{min-height:22px;padding:1px 4px;margin:0 -4px;white-space:nowrap}
.prop.compact.wrap .prop-v{overflow:hidden;text-overflow:ellipsis;min-width:140px;max-width:260px}
.prop.compact .prop-e input,.prop.compact .prop-e select{padding:3px 6px;min-width:110px}
/* 【2026-11-23】スプシのプルダウンと同じ見え方（制作の「状態」）。押すと一覧が開く＝選ぶとステータスも変わる */
.ddchip{display:inline-flex;align-items:center;gap:6px;padding:1px 8px 1px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.ddchip .caret{font-style:normal;color:var(--muted);font-size:11px;line-height:1}
.prop:not(.ro) .prop-v:hover .ddchip{border-color:var(--accent);color:var(--accent2)}
.prop.compact .prop-v:has(.ddchip){cursor:pointer}
.prop.saving{opacity:.55}

/* 1件の詳しい画面（右から出る） */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.38);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(940px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.panel-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--accent-weak);color:var(--accent2);display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 44px}
.ph-main{flex:1;min-width:0}
.ph-kind{font-size:12px;color:var(--muted);font-weight:600}
.ph-main h2{margin:0;font-size:20px;line-height:1.3;overflow-wrap:anywhere}
.ph-sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.x{border:0;background:none;font-size:24px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--gray-weak)}
.stagebar{display:flex;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 18px;gap:6px;overflow-x:auto}
.stagebar button{flex:1;min-width:92px;border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:7px 8px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.stagebar button:hover{border-color:var(--accent);color:var(--accent2)}
.stagebar button.done{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent2)}
.stagebar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stagebar button.lost.on{background:#8a8796;border-color:#8a8796}
.stagebar button.lost.on.sb-失注{background:#9b3f55;border-color:#9b3f55}
.facts{display:flex;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.fact{min-width:110px}
.fact .l{font-size:11px;color:var(--muted);font-weight:600}
.fact .v{font-weight:800;font-variant-numeric:tabular-nums}
.panel-body{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:14px 18px 40px;align-items:start}
.pgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.pgroup > h4{margin:0;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--surface-2);cursor:pointer;user-select:none}
.pgroup > h4 .cv{margin-left:auto;color:var(--muted);font-size:11px}
.pgroup .pbody{padding:6px 4px}
.side-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side-tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.side-tabs button.on{color:var(--accent2);border-bottom-color:var(--accent)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 22px}
.timeline li::before{content:"";position:absolute;left:6px;top:8px;bottom:-2px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline li::after{content:"";position:absolute;left:2px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.timeline .t{font-size:12px;color:var(--muted)}
.timeline .w{font-weight:700}
.timeline .d{font-size:12px;color:var(--ink2);margin-top:2px}
.assoc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px}
.assoc > h4{margin:0;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.assoc > h4 .n{margin-left:auto}

/* ボード（商談） */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:#e9ecf3;border-radius:var(--radius);padding:8px;min-height:160px;border:2px solid transparent;transition:border-color .12s,background .12s}
.col.over{border-color:var(--accent);background:var(--accent-weak)}
.col-h{display:flex;align-items:center;gap:8px;margin:2px 4px 8px}
.col-h .sum{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;text-align:right}
.dcard{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab;width:100%;text-align:left;box-shadow:0 1px 1px rgba(16,24,40,.04)}
.dcard:hover{border-color:var(--accent-line);box-shadow:var(--shadow)}
.dcard.dragging{opacity:.4}
.dcard .t{font-weight:700;color:var(--ink)}
.dcard .m{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .r{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:12px}
.dcard .src{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.dcard .who{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--accent-weak);color:var(--accent2);display:grid;place-items:center;font-size:11px;font-weight:800}
/* 【2026-11-18】段階でカードの左の帯の色を変える（青柳さん「状況によって色変えたいよね」）・見込みA〜C の札・担当の2人 */
.dcard{border-left:4px solid var(--line-2)}
.dcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dcard.sc-アポ{border-left-color:var(--info)}
.dcard.sc-着座{border-left-color:var(--accent)}
.dcard.sc-見込み{border-left-color:#e0a21b}
.dcard.sc-受注{border-left-color:var(--ok);background:#f7fcf9}
.dcard.sc-失注{border-left-color:#d9a3b1;background:#fdfafb}
.dcard.sc-対象外{border-left-color:#cfccd8;background:#fafafb}
.dcard.sc-失注 .t,.dcard.sc-対象外 .t{color:var(--muted)}
.dcard.rkc-A{background:#fff8f7}
.dcard .ppl{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px;color:var(--ink2)}
.dcard .ppl i{font-style:normal;font-size:11px;color:var(--faint);margin-right:4px}
.dcard .ppl .nobody{color:var(--late);font-weight:700}
.dcard .cwarn{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;color:var(--late);background:var(--late-weak);border-radius:6px;padding:2px 7px}
.dcard .ranks{display:flex;gap:4px;align-items:center;margin-top:8px}
.dcard .ranks .muted{margin-right:2px}
.rank{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;font-size:11px;font-weight:800;margin-left:6px;vertical-align:1px}
.rk-A{background:#fde2e1;color:#b42318}
.rk-B{background:#fdf1d9;color:#8f5d0c}
.rk-C{background:#e3ebfd;color:#1d55c2}
.rkbtn{min-width:30px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--faint);font-size:12px;font-weight:800;cursor:pointer;padding:0 6px}
.rkbtn:hover{border-color:var(--line-2);color:var(--ink2)}
.rkbtn.on.rk-A{background:#b42318;border-color:#b42318;color:#fff}
.rkbtn.on.rk-B{background:#b7791f;border-color:#b7791f;color:#fff}
.rkbtn.on.rk-C{background:#1d55c2;border-color:#1d55c2;color:#fff}
table.list tr.sr-受注 td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
table.list tr.sr-見込み td:first-child{box-shadow:inset 3px 0 0 #e0a21b}
table.list tr.sr-着座 td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
table.list tr.sr-アポ td:first-child{box-shadow:inset 3px 0 0 var(--info)}
table.list tr.sr-失注 td,table.list tr.sr-対象外 td{color:var(--muted)}
td.nobodycell .prop-v.is-empty{color:var(--late);font-weight:700}
table.list th.chk,table.list td.chk{width:34px;padding-right:0;text-align:center}
table.list th.rowno,table.list td.rowno{width:40px;padding-right:2px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
/* 【2026-11-19】施策の参加者・代理店から紹介された人の表（会社名・お名前・役職・事前課題・事業内容） */
table.list.ppl th,table.list.ppl td{padding:6px 8px;font-size:12.5px;vertical-align:top}
table.list.ppl td.name{min-width:110px}
table.list.ppl td.bg{min-width:170px;white-space:pre-wrap}
/* 【2026-11-20】右端（商談にする・消す）は、表を横に送っても見えるように右に留める（前は横に送らないと「商」しか見えなかった） */
table.list.ppl th.acts,table.list.ppl td.acts{position:sticky;right:0;background:var(--surface);box-shadow:-8px 0 8px -8px rgba(20,30,50,.18);white-space:nowrap}
.menu button.danger{color:var(--late)}
/* 【2026-11-20】目標の画面＝目標・実績・達成率・今日までの目安・今日時点の進捗率を1つの表に（青柳さん「KGIKPIの目標 実績 達成率で入れてほしい、今だとわからない」） */
.gm-card{padding:14px 16px;margin-bottom:14px}
.gm-pace{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:10px;font-size:13.5px}
.gm-pace .gm-elapsed{flex:1;min-width:160px;margin-top:0;height:8px}
.gm-pace .gm-elapsed i{background:var(--ink2)}
.gm-pace .muted{flex-basis:100%}
table.list.gm td{vertical-align:middle}
table.list.gm tr.grp td{background:var(--surface-2);font-weight:700;font-size:12.5px;color:var(--ink2)}
.gm-big{font-size:17px}
.gm-reach{display:flex;align-items:center;gap:10px}
/* 【2026-11-20】％の幅をそろえる＝どの行も棒の長さが同じになり、今日の縦線が同じ位置に並ぶ（前は「36.1%」と「25%」で棒の長さが変わり、縦線がずれていた） */
.gm-reach b{flex:0 0 54px;text-align:right}
.gm-reach .meter{flex:1;position:relative;margin-top:0;height:8px;overflow:visible}
.gm-mk{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);opacity:.6;border-radius:1px}
.gm-pp{display:inline-block;font-weight:700;border-radius:999px;padding:1px 9px;font-size:12.5px;white-space:nowrap}
.gm-pp.ok{background:var(--ok-weak);color:var(--ok)}
.gm-pp.mid{background:var(--warn-weak);color:var(--warn)}
.gm-pp.ng{background:var(--late-weak);color:var(--late)}
/* 【2026-11-20】「今日までに達成しておくべき」の列（実績・達成率と横で比べる）＝薄い色で区別する。足りない数は赤 */
table.list.gm th.gm-must,table.list.gm td.gm-must{background:var(--surface-2);color:var(--ink2);font-weight:700}
table.list.gm th.grp{text-align:center}
.gm-gap{display:block;font-size:11.5px;color:var(--ok);font-weight:700;margin-top:3px}
.gm-gap.late{color:var(--late)}
.gm-rates{margin:10px 2px 0}
.rch{display:block;font-size:11px;color:var(--muted);font-weight:700}
table.list tr.nowrow td{background:var(--accent-weak)}
/* 【2026-11-20】青柳さん「スプシみたいに線入れて区切らないとわかりづらい」→「全部の表に入れる」＝どの表も、マスの間に縦の線を入れる（横の線も少し濃く）。
   いちばん右の列は外の枠と重なるので線を引かない。見出しが2段の表（施策・代理店・分析）は、2段目のいちばん右のマスの右に
   1段目から下りてくる列（受注金額・商談に無い契約）がある＝そこは線を残す */
table.list th,table.list td{border-right:1px solid var(--line-2);border-bottom-color:var(--line-2)}
table.list th:last-child,table.list td:last-child{border-right:0}
table.list thead tr + tr th:last-child{border-right:1px solid var(--line-2)}
table.list tr.grp td{border-right:0}
/* リード元ごとの表の右端（消す）も、横に送っても見えるように右に留める */
table.list.routem th.acts,table.list.routem td.acts{position:sticky;right:0;background:var(--surface);box-shadow:-8px 0 8px -8px rgba(20,30,50,.18);white-space:nowrap}
.pill.gm-now{background:var(--accent);color:#fff;margin-left:6px;font-size:11px}
/* overflow:hidden のままだと、高さの決まった枠（panel-body）の中で行の高さが 0 扱いになり、下の2列が上に重なる */
.panel-body > .pgroup.wide{grid-column:1/-1;margin-bottom:0;overflow:visible}
table.list td.srcc{min-width:130px;white-space:nowrap}

/* 【2026-11-18 同日5回目】グラフ（月の本数・稼働・紹介）。色は系列の順で固定（1 青・2 橙・3 緑青）＝validate_palette で3色とも合格。
   緑青は白い地との差が 3:1 に届かない＝凡例・数字・「表で見る」を必ず付ける */
:root{--series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--series-muted:#b4b2a9;--seq-100:#cde2fb;--seq-200:#9ec5f4;--seq-300:#6da7ec;--seq-400:#3987e5;--seq-500:#256abf;--crit:#d03b3b}
.tchart{position:relative}
.tchart .lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);margin:0 0 6px}
.tchart .lg-i{display:inline-flex;align-items:center;gap:6px}
.tchart .key{display:inline-block;flex:0 0 auto}
.tchart .key.bx{width:10px;height:10px;border-radius:2px}
.tchart .key.ln{width:14px;height:2px;border-radius:1px}
.tc-box{position:relative;width:100%;overflow:hidden}
.tc-box svg{display:block;overflow:visible}
.tc-grid{stroke:var(--line);stroke-width:1}
.tc-base{stroke:var(--line-2);stroke-width:1}
.tc-tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tc-val{font-size:12px;font-weight:700;fill:var(--ink)}
.tc-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tc-dot{stroke:#fff;stroke-width:2}
.tc-hl{fill:rgba(16,24,40,.045)}
.tc-cross{stroke:var(--line-2);stroke-width:1}
.tc-hit{fill:transparent;cursor:default;outline:none}
.tc-hit:focus-visible{stroke:var(--accent);stroke-width:2}
.tchart .tt{position:absolute;top:6px;z-index:3;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;pointer-events:none}
.tchart .tt-h{font-weight:700;color:var(--muted);margin-bottom:4px}
.tchart .tt-r{display:flex;align-items:center;gap:8px;line-height:1.7}
.tchart .tt-r b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:44px}
.tchart .tt-r span:last-child{color:var(--muted)}
details.tview{margin-top:6px}
details.tview > summary{cursor:pointer;font-size:12px;color:var(--accent2);font-weight:700;padding:4px 0}
.chartcard{padding:14px 16px 10px;margin-bottom:14px}
.chartcard h2{font-size:15px;margin:0 0 2px}
.chartcard .cap{font-size:12px;color:var(--muted);margin:0 0 10px}
/* 本数の消化（受付 ÷ プランの本数）。線の地は同じ青の薄い段 */
.mtr{display:flex;align-items:center;gap:8px;min-width:130px}
.mtr .trk{flex:1;height:6px;border-radius:3px;background:var(--seq-100);overflow:hidden}
.mtr .trk i{display:block;height:100%;border-radius:3px;background:var(--series-1)}
.mtr.over .trk i{background:var(--crit)}
.mtr .fig{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.mtr .tag{font-size:11px;font-weight:700;color:var(--late);background:var(--late-weak);border-radius:999px;padding:0 6px}
/* 紹介元の社数（横の棒・1色） */
.hbar{display:flex;align-items:center;gap:8px;min-width:150px}
.hbar i{display:block;height:8px;border-radius:0 4px 4px 0;background:var(--series-1);min-width:2px}
.hbar b{font-variant-numeric:tabular-nums}
.heatlg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin:0 0 10px}
.heatlg span{display:inline-flex;align-items:center;gap:5px}
.heatlg i{display:inline-block;width:14px;height:14px;border-radius:3px}
/* フォームの回答 */
tr.qa > td{background:var(--surface-2);padding:10px 16px 14px}
dl.qa{display:grid;grid-template-columns:minmax(140px,260px) 1fr;gap:6px 16px;margin:0;font-size:13px}
dl.qa dt{color:var(--muted);font-weight:600}
dl.qa dd{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
@media (max-width:720px){ dl.qa{grid-template-columns:1fr} dl.qa dd{margin-bottom:6px} }
button.exp{background:none;border:0;color:var(--accent2);font-weight:700;padding:2px 4px;white-space:nowrap}
.key-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
/* 【2026-11-18 同日6回目】有効商談の札（売上管理シートと同じ：有効＝緑・無効＝灰）・商談進捗の帯・代理店の稼働の点 */
.vchip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;white-space:nowrap;line-height:1.7}
.vchip.v-有効{background:var(--ok-weak);color:var(--ok)}
.vchip.v-無効{background:var(--gray-weak);color:var(--gray)}
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 14px;margin-bottom:12px}
.prog .pg{display:flex;flex-direction:column;min-width:60px}
.prog .pg .l{font-size:11px;color:var(--muted);font-weight:600}
.prog .pg b{font-size:20px;line-height:1.25}
.prog .pg .s{font-size:11px;color:var(--muted);white-space:nowrap}
.prog .pg.ok b{color:var(--ok)}
.prog .pa{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.prog .pa::after{content:"→";font-size:15px;color:var(--faint)}
.mdots{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.mdots i{display:inline-block;width:9px;height:9px;border-radius:50%}
.mdots i.on{background:var(--series-1)}
.mdots i.off{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.mdots i.na{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.mdots .fig{margin-left:6px;font-size:12px;color:var(--ink2)}
/* 【2026-11-19】タスク（人ごとの数・期限ごとのまとまり・この件のやること） */
.taskpeople{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.taskpeople .tp{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:118px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;cursor:pointer}
.taskpeople .tp:hover{border-color:var(--accent-line)}

  // 【2026-11-19】「失注・対象外」を「失注」と「対象外」に分けた（青柳さん「失注と対象外は分けて」）。対象外＝商談対象外（無効商談）

  function prefGet(k, d) { try { const v = localStorage.getItem('avatifi_pref_' + k); return v == null ? d : v; } catch (e) { return d; } }

    setTimeout(() => { const i = S.toasts.indexOf(t); if (i >= 0) S.toasts.splice(i, 1); }, kind === 'error' ? 10000 : 5000);

  // 1件を見分ける値（商談・施策・依頼は ID、顧客・代理店は名前）。ID が空の行（シートに手で足した行）は行番号で見分ける
  function keyOf(kind, r) { const k = kind === 'deal' || kind === 'camp' || kind === 'req' || kind === 'people' || kind === 'card' ? r.id : r.name; return k ? k : '#' + r._row; }
  function findRow(kind, key) { return (S.data[kind] || []).filter(r => String(keyOf(kind, r)) === String(key))[0] || null; }

  // 1つの項目を保存する（商談・施策・代理店・顧客）
  async function saveField(kind, row, key, value) {
    const id = kind === 'deal' || kind === 'camp' || kind === 'people' || kind === 'card' ? row.id : row.name;

  // 関わる一覧を、今の一覧を残したまま裏で読み直す（捨てると、開いている詳しい画面が「読み込んでいます…」のまま止まる）
  function refresh(k) { if (S.data[k]) ensure(k, true).catch(() => {}); }
  function afterChange(kind, key) {
    markDirty();
    if (kind === 'deal') { refresh('camp'); refresh('agency'); if (key === 'result' || key === 'stage' || key === 'new') refresh('cust'); }
    if (kind === 'camp' && key === 'name') { refresh('deal'); refresh('people'); }
    // 【2026-11-19】参加者リストを直したら、施策の参加の数を出し直す
    if (kind === 'people') refresh('camp');
    // 施策の目標・代理店を直したら、達成率と数を出し直す（裏で読み直す）
    if (kind === 'camp' || kind === 'agency') refresh(kind);
    if (kind === 'cust') S.data.payWide = null;
    // 【2026-11-19】担当や結果を直すと、やること（自動のタスク）も変わる。
    //   【同日 レビュー】保存のたびに全部を計算し直すと重い（本番の Apps Script）＝タスクが見えているとき（タスクの画面・詳しい画面）だけ、
    //   続けて直したら最後の1回にまとめて読み直す。見えていなければ印（dirty）だけ＝タスクの画面を開いたときに読む
    if (S.data.tasks && (S.view === 'task' || S.panel)) reloadTasksSoon();
  }
  let taskTimer = null;
  function reloadTasksSoon() {
    clearTimeout(taskTimer);

  // 【2026-11-20】消す（青柳さん「削除できるの？」「項目を追加する。のようなボタンはすべてにおいてほしい。削除も」）。
  //   裏（appDelete）は中身を履歴に残してから行を空にする。消したら一覧からも外し、つながった一覧（参加者・商談・タスク）を読み直す
  async function deleteRecord(kind, row) {
    const key = keyOf(kind, row);

    ((res && res.notes) || []).forEach(n => toast(n, 'ok'));
    if (kind === 'deal') { refresh('people'); refresh('card'); }

  // 受注にするときに聞く（商談結果・受注した商材・初期費用・月額）。顧客の行はこの値で作られる
  function wonResults() { return (S.lists['商談結果'] || []).filter(r => S.cats[r] === '受注'); }
  function askWin(d) {

  // 商談の段階を変える（ボードのドラッグ・詳しい画面の段階の帯・表の段階）
  async function moveDeal(d, stage) {
    if (!d || d.stage === stage) return;
    let extra = null;
    if (stage === '受注' && S.cats[d.result] !== '受注') {
      extra = await askWin(d);
      if (!extra) return;
    }
    if (stage === 'リード' && (d.apoDate || d.meetPlan || d.meetDate)) {
      if (!(await ask('「リード」に戻しますか？', 'アポ獲得日・商談予定日・商談実施日・商談結果を空にします。', '空にして戻す', true))) return;

    try {
      const res = await run('appDealMove', d.id, stage, extra);

  // 【2026-11-18 同日6回目】有効商談＝着座した商談のうち、結果の数え方が「無効」（商談対象外（無効商談））でないもの
  //   （売上管理シートの KPI の「有効商談着座のみ」・「有効商談は緑、無効商談と先方都合リスケはグレー」と同じ考え方）
  function dealSat(d) { const c = S.cats[String(d.result || '').trim()] || ''; return c === '受注' || (!!d.meetDate && c !== '未着座' && c !== 'リスケ'); }
  function dealValidity(d) { if (!dealSat(d)) return ''; return (S.cats[String(d.result || '').trim()] || '') === '無効' ? '無効' : '有効'; }

  function rankOf(d) { const m = String((d && d.result) || '').match(/^見込み([ABC])$/); return m ? m[1] : ''; }

    if (d.stage === '見込み' && d.result === r) return;
    const old = { stage: d.stage, result: d.result };

  }

  // ---------------------------------------------------------------- 書式
  function parseYmd(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function md(s) { const d = parseYmd(s); return d ? (d.getMonth() + 1) + '/' + d.getDate() + '(' + W[d.getDay()] + ')' : (s || ''); }
  function mdy(s) {
    const d = parseYmd(s);
    if (!d) return s || '';
    const y = Number(String(S.today).slice(0, 4));
    return (d.getFullYear() !== y ? d.getFullYear() + '/' : '') + (d.getMonth() + 1) + '/' + d.getDate() + '(' + W[d.getDay()] + ')';
  }

  function initial(s) { const t = String(s || '').replace(/^(株式会社|合同会社|有限会社|一般社団法人)/, '').trim(); return t ? t.charAt(0) : '？'; }
  // シートから来た値をリンクにするのは http(s) のときだけ（シートは人が直接書ける＝javascript: などを押させない）
  function safeUrl(u) { const s = String(u == null ? '' : u).trim(); return /^https?:\/\//i.test(s) ? s : ''; }

  // 【2026-11-19】役割が「制作」だけの人（制作の画面だけ出す。青柳さん「坂口もいれといて。見れるのは制作のとこのみ」）
  function prodOnly() { return !!(S.user && S.user.prodOnly); }
  // 【2026-11-19】外の人の名前に「様」（青柳さん「こちらの従業員の名前以外の全員に様がつくようにして。外部全員」）。
  //   台帳・シートの値は変えず、画面に出すときだけ付ける（名前で突き合わせている所を壊さない）。
  //   社内の人（設定の「システムを使う人」と「営業の名前」＝lists 社内）と、もう敬称の付いた名前（様・さま・御中・殿・社長・先生・会長・各位）には付けない。
  //   「さん」は「様」にする。「架空・早川」のように「・」でつないだ名前は1人ずつ。「名前（会社名）」は括弧の前に付ける
  function sama(n) {
    const s = String(n == null ? '' : n).trim();
    if (!s) return '';
    const staff = (S.lists && (S.lists['社内'] || S.lists['人'])) || [];
    const one = t => {
      const x = String(t).trim();
      if (!x || staff.indexOf(x) >= 0) return x;
      if (/(様|さま|御中|殿|社長|先生|会長|各位)$/.test(x)) return x;
      if (/さん$/.test(x)) return x.replace(/さん$/, '様');
      return x + '様';
    };
    const m = s.match(/^([^（(]+?)\s*([（(].*)$/);
    if (m) return one(m[1]) + m[2];
    return s.split('・').map(one).join('・');
  }
  // タスクの見出し：商談（名前（会社名））と代理店フィー（代理店名　金額）は外の人の名前（手で足したタスクは書いたまま）
  function taskTitle(x) {
    const t = String(x && x.title || '');
    if (!x || !x.auto) return t;
    if (x.src === '商談') return sama(t);
    if (x.src === '代理店フィー') { const i = t.indexOf('　'); return i > 0 ? sama(t.slice(0, i)) + t.slice(i) : sama(t); }
    if (x.src === '施策') return campLabel(t);
    return t;
  }
  // 【2026-11-19】施策名の頭にある人の名前にも「様」（青柳さん「様ついてなくね？」＝「架空協賛セミナー」→「架空様協賛セミナー」「架崎さん交流会」→「架崎様交流会」）。
  //   「◯◯協賛／主催／集客／共催…」の◯◯は人の名前とみなす。「◯◯セミナー／交流会」は、◯◯が施策の協業者か代理店の名前の頭と同じときだけ（「AIセミナー」「11月交流会」は変えない）。
  //   社内の人・もう「様」の付いた名前は変えない。施策名の値は変えない（画面に出すときだけ）
  function knownPartner(who) {
    const w = normName(who);
    if (!w) return false;
    const list = [];
    (S.data.camp || []).forEach(c => String(c.partner || '').split('・').forEach(p => { const k = normName(String(p).replace(/(社長|先生|会長)$/, '')); if (k) list.push(k); }));
    (S.data.agency || []).forEach(a => { const k = normName(a.name); if (k) list.push(k); });
    return list.some(p => p === w || p.indexOf(w) === 0);
  }
  function campLabel(n) {
    const s = String(n == null ? '' : n);
    const m = s.match(/^(.+?)(さん|様)?(協賛|主催|集客|共催|交流会|ランチ会|勉強会|食事会|セミナー)/);
    if (!m || m[2] === '様') return s;
    const who = m[1].trim();
    const staff = (S.lists && (S.lists['社内'] || S.lists['人'])) || [];
    if (!who || staff.indexOf(who) >= 0) return s;
    const strong = /^(協賛|主催|集客|共催)$/.test(m[3]) && !/[0-9０-９月年回第]/.test(who);
    if (!strong && !knownPartner(who)) return s;
    return who + '様' + s.slice(m[1].length + (m[2] ? m[2].length : 0));
  }
  // 経路の詳細が人（会社）の名前になる経路（セミナー・交流会・SNS などは施策名や媒体の名前＝施策名なら頭の人の名前にだけ「様」）
  const SAMA_SOURCES = ['代理店の紹介', '紹介', '既存のお客様'];
  function detailSama(source, detail) { return SAMA_SOURCES.indexOf(String(source || '')) >= 0 ? sama(detail) : campLabel(detail); }
  // 分析の「経路：経路の詳細」の行
  function routeKey(k) { const s = String(k || ''); const i = s.indexOf('：'); return i < 0 ? s : s.slice(0, i + 1) + detailSama(s.slice(0, i), s.slice(i + 1)); }
  // 【2026-11-19】売上管理シートから取り込んだ1行（施策「名前（社内の担当）［アポ］」／代理店「名前（事業内容）」）を分ける
  function parseImported(line) {
    let s = String(line || '').trim();
    let tag = '';
    s = s.replace(/［(.*?)］/g, (x, t) => { tag = t; return ''; }).trim();
    let note = '';
    const m = s.match(/^(.*?)[（(](.*?)(?:[)）](.*))?$/);
    if (m) { note = [m[2], m[3]].map(x => String(x || '').trim()).filter(Boolean).join('・'); s = m[1]; }
    return { name: s.replace(/[\s　]+/g, ' ').trim(), note: note, tag: tag };
  }
  // 名前の突き合わせ（空白・敬称・括弧を外す）
  function normName(n) { return String(n || '').normalize('NFKC').replace(/[（(].*?[)）]/g, '').replace(/［.*?］/g, '').replace(/[\s　]/g, '').replace(/(様|さん)$/, ''); }
  // 【2026-11-20】画面に出す項目名（「経路」「流入経路」→「リード元」。台帳の見出しは変えない＝保存は項目の名前（f[0]）で書く）
  function uiLabel(s) { return String(s == null ? '' : s).replace(/流入経路/g, 'リード元').replace(/経路/g, 'リード元'); }
  function uiFields(fs) { const out = {}; Object.keys(fs || {}).forEach(k => { out[k] = (fs[k] || []).map(f => [f[0], uiLabel(f[1])].concat(f.slice(2))); }); return out; }
  function fieldsOf(kind) { return S.fields[kind] || []; }
  function fieldOf(kind, key) { return fieldsOf(kind).filter(f => f[0] === key)[0] || [key, key, 'text', '']; }
  function isRo(f) { return f[2] === 'id' || String(f[2]).indexOf('ro') === 0; }
  function dealPerson(d) { return d.closer || d.apoOwner || d.leadOwner || ''; }
  function textHit(obj, keys, q) {
    if (!q) return true;
    const s = q.toLowerCase();
    return keys.some(k => String(obj[k] == null ? '' : obj[k]).toLowerCase().indexOf(s) >= 0);
  }
  // 【2026-11-23 レビュー】リンクの一覧の1行を「説明の文字・URL・うしろの文字」に分ける。URL は空白か、全角のかっこ・句読点の手前まで。
  //   最後の「.」「,」などと、対になっていない「)」も URL に入れない（前は「（https://…）」の「）」までリンクになって開けなかった）
  function linkParts(s) {
    const m = String(s).match(/https?:\/\/[^\s（）「」『』【】〔〕［］｛｝〈〉《》、。，．！？＜＞"'<>]+/i);
    if (!m) return { text: String(s), url: '', after: '' };
    let u = m[0];
    for (;;) {
      if (/[.,;:!?]$/.test(u)) { u = u.slice(0, -1); continue; }
      if (/\)$/.test(u) && (u.match(/\(/g) || []).length < (u.match(/\)/g) || []).length) { u = u.slice(0, -1); continue; }
      break;
    }
    return { text: s.slice(0, m.index).trim(), url: u, after: s.slice(m.index + u.length).trim() };
  }
  // 【2026-11-23】名刺の写真を、長い辺1600pxの JPEG に縮めて base64 にする（送る量を減らす。スマホの写真の向きはそのまま）。
  //   縮められない形式（ブラウザが開けない HEIC など）は、そのまま送る（8MBまで）
  async function shrinkImage(file) {
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(new Error('写真を読めませんでした：' + file.name)); r.readAsDataURL(file); });
    try {
      const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('decode')); im.src = url; });
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k));
      c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return { name: file.name, type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };
    } catch (e) {
      if (file.size > 8 * 1024 * 1024) throw new Error('写真が大きすぎます（8MBまで）：' + file.name);
      return { name: file.name, type: file.type || 'image/jpeg', data: url.split(',')[1] };
    }
  }
  function sortRows(rows, key, dir) {
    return rows.slice().sort((a, b) => {

  }
  function meterClass(r) { return r === '' || r == null ? '' : (r >= 1 ? 'ok' : (r < 0.5 ? 'warn' : '')); }
  function meterW(r) { return r === '' || r == null ? '0%' : Math.min(100, Math.round(Number(r) * 100)) + '%'; }
  const G = { S, md, mdy, yen, pct, ymLabel, initial, safeUrl, me, isAdmin, MIHON, STAGES, END_STAGES, meterClass, meterW, dealPerson, sama, detailSama, prodOnly, taskTitle, routeKey, campLabel, campKindLabel };

  // 並べ替えのしかけ（表の見出しを押す）
  const sortMixin = {

  // ---------------------------------------------------------------- 部品：その場で直す欄
  const PropField = {
    // compact・no-empty は属性だけで書く（Boolean と書かないと、属性だけのとき空の文字＝「無い」扱いになる）
    // pill＝値を色つきの札で出す（例 "st-" で段階の色。値の名前がそのまま色の名前になる）
    // sama＝外の人の名前（出すときだけ「様」を付ける。直すときは元の値のまま）【2026-11-19】
    // fmt＝'camp'（施策名の頭の人に様）／'route'（「経路：経路の詳細」か施策名）【2026-11-19】

    props: { f: Array, value: null, readonly: Boolean, compact: Boolean, hint: String, emptyText: String, noEmpty: Boolean, pill: String, sama: Boolean, fmt: String, dd: Boolean },
    emits: ['save'],
    data() { return { editing: false, v: '', saving: false, typed: false }; },
    computed: {
      type() { return String(this.f[2] || 'text'); },
      choices() {
        const t = this.type;
        if (t === 'person') return S.lists['人'] || [];
        if (t.indexOf('choice:') === 0) return S.lists[t.slice(7)] || [];

        if (String(nv) === String(this.value == null ? '' : this.value)) return;
        this.saving = true;
        try { await new Promise((res, rej) => this.$emit('save', nv, res, rej)); } catch (e) { /* 知らせは呼んだ側 */ } finally { this.saving = false; }
      },

        const name = await addPerson(PERSON_ROLE_OF[this.f[0]]);

        this.saving = true;

      },
      onKey(e) {

        else if (e.key === 'Enter' && this.type === 'date' && !this.dateReady()) { e.preventDefault(); toast('日付が途中です。年（4けた）を打ったら → キーで月・日へ進んでください（例 2026/11/05）。カレンダーから選んでも入ります。保存していません', 'error'); }
        else if (e.key === 'Enter' && !this.multi) { e.preventDefault(); this.commit(); }
        else if (e.key === 'Enter' && this.multi && (e.ctrlKey || e.metaKey)) { e.preventDefault(); this.commit(); }
      },
      // 【2026-11-20】日付はキーボードで打つと、1文字ごとに change が来る（「2」を打った時点で 0002年として保存されていた）。
      //   打ち始めたら change では保存しない＝Enter か、欄を離れたときに保存する。カレンダーで選んだときは change のその場で保存

      },

            <option v-if="type === 'person'" :value="ADD_PERSON">＋ 新しい人を足す…</option>

          <input v-else type="text" v-model="v" @keydown="onKey" @blur="onBlur" :aria-label="f[1]">

  // 見え方のタブ
  const ViewTabs = {
    props: ['tabs', 'modelValue'],
    emits: ['update:modelValue'],
    template: `<div class="vtabs" role="tablist"><button v-for="t in tabs" :key="t[0]" role="tab" :aria-selected="modelValue === t[0]" :class="{on: modelValue === t[0]}" @click="$emit('update:modelValue', t[0])">{{ t[1] }}<span class="n" v-if="t[2] !== undefined">{{ t[2] }}</span></button></div>`,
  };

  // ---------------------------------------------------------------- 部品：月ごとのグラフ【2026-11-18 同日5回目】
  // 青柳さん「稼働や紹介も可視化を」。棒は積み上げか横並び（太さ24pxまで・上の角だけ4px丸く・あいだ2px）、線は2px・点は8px（白い縁）。
  //   目盛りは左の1本だけ。2系列からは凡例。なぞる／押す／Tab で、その月の値を全部出す。「表で見る」で同じ数字を表で（色だけに頼らない）
  function topRoundPath(x, yt, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h));
    const yb = yt + h;
    return 'M' + x + ',' + yb + 'V' + (yt + r) + 'Q' + x + ',' + yt + ' ' + (x + r) + ',' + yt + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + yt + ' ' + (x + w) + ',' + (yt + r) + 'V' + yb + 'Z';
  }
  const TrendChart = {
    props: { labels: Array, series: Array, stacked: Boolean, pct: Boolean, unit: { type: String, default: '' }, height: { type: Number, default: 220 }, title: String },
    data() { return { w: 640, hi: -1, L: 44, R: 16, T: 20, B: 26 }; },
    computed: {
      n() { return (this.labels || []).length; },
      pw() { return Math.max(60, this.w - this.L - this.R); },
      ph() { return Math.max(40, this.height - this.T - this.B); },
      band() { return this.n ? this.pw / this.n : this.pw; },
      bars() { return (this.series || []).filter(s => s.type !== 'line'); },
      lines() { return (this.series || []).filter(s => s.type === 'line'); },
      totals() { return (this.labels || []).map((_, i) => this.bars.reduce((a, s) => a + (Number(s.values[i]) || 0), 0)); },
      maxV() {
        let m = 0;
        if (this.stacked) this.totals.forEach(v => { m = Math.max(m, v); });
        else this.bars.forEach(s => s.values.forEach(v => { m = Math.max(m, Number(v) || 0); }));
        this.lines.forEach(s => s.values.forEach(v => { if (v !== '' && v != null) m = Math.max(m, Number(v) || 0); }));
        return m;
      },
      ticks() {
        const out = [];
        if (this.pct) { const top = Math.max(1, Math.ceil(this.maxV * 4) / 4); for (let i = 0; i * 0.25 <= top + 1e-9; i++) out.push(i * 0.25); return out; }
        const m = Math.max(this.maxV, 1);
        const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000].filter(s => m / s <= 4)[0] || Math.ceil(m / 4);
        for (let v = 0; v <= Math.ceil(m / step) * step; v += step) out.push(v);
        return out;
      },
      top() { return this.ticks[this.ticks.length - 1] || 1; },
      cols() {
        const Y = v => this.T + this.ph - (v / this.top) * this.ph;
        return (this.labels || []).map((_, i) => {
          const segs = [];
          if (this.stacked) {
            const bw = Math.min(24, this.band * 0.56);
            const x = this.L + i * this.band + (this.band - bw) / 2;
            let acc = 0;
            const vals = this.bars.map(s => Number(s.values[i]) || 0);
            let last = -1;
            vals.forEach((v, k) => { if (v > 0) last = k; });
            vals.forEach((v, k) => {
              if (v <= 0) return;
              const y1 = Y(acc + v);
              let h = Y(acc) - y1 - (acc > 0 ? 2 : 0);   // 下の段とのあいだに2pxのすき間
              acc += v;
              if (h < 1) h = 1;
              segs.push({ k: k, color: this.bars[k].color, d: k === last ? topRoundPath(x, y1, bw, h, 4) : 'M' + x + ',' + (y1 + h) + 'V' + y1 + 'H' + (x + bw) + 'V' + (y1 + h) + 'Z' });
            });
            return { i: i, segs: segs, cx: x + bw / 2, topY: Y(acc) };
          }
          const k = this.bars.length;
          const gw = k ? Math.min(24, (this.band * 0.72 - (k - 1) * 2) / k) : 0;
          const x0 = this.L + i * this.band + (this.band - (k * gw + (k - 1) * 2)) / 2;
          let topY = Y(0);
          this.bars.forEach((s, j) => {
            const v = Number(s.values[i]) || 0;
            if (v <= 0) return;
            const y1 = Y(v);
            topY = Math.min(topY, y1);
            segs.push({ k: j, color: s.color, d: topRoundPath(x0 + j * (gw + 2), y1, gw, Y(0) - y1, 4) });
          });
          return { i: i, segs: segs, cx: this.L + i * this.band + this.band / 2, topY: topY };
        });
      },
      paths() {
        const Y = v => this.T + this.ph - (v / this.top) * this.ph;
        return this.lines.map(s => {
          const pts = [];
          let d = '';
          let pen = false;
          s.values.forEach((v, i) => {
            if (v === '' || v == null || isNaN(Number(v))) { pen = false; return; }
            const x = this.L + i * this.band + this.band / 2;
            const y = Y(Number(v));
            d += (pen ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
            pen = true;
            pts.push({ i: i, x: x, y: y });
          });
          return { name: s.name, color: s.color, d: d, pts: pts };
        });
      },
      // 数字を直接書くのは、いちばん右の月だけ（棒は合計・線は値）。近すぎるときは書かない（凡例・なぞる・表で読める）
      endLabels() {
        const out = [];
        const i = this.n - 1;
        if (i < 0) return out;
        const c = this.cols[i];
        // 横並びの棒には書かない（どちらの棒の数か分かりにくい＝凡例・なぞる・表で読む）
        if (this.bars.length && this.stacked && c && c.segs.length) {
          out.push({ x: c.cx, y: c.topY - 6, a: 'middle', t: this.fmtV(this.totals[i]) });
        }
        this.paths.forEach(p => {
          const q = p.pts[p.pts.length - 1];
          if (!q || q.i !== i) return;
          const y = q.y - 9;
          if (out.some(o => Math.abs(o.y - y) < 14)) return;
          out.push({ x: q.x - 8, y: y, a: 'end', t: this.fmtV(this.lines.filter(s => s.name === p.name)[0].values[i]) });
        });
        return out;
      },
      xEvery() { return this.band >= 40 ? 1 : (this.band >= 22 ? 2 : 3); },
      ttLeft() { const x = this.L + this.hi * this.band + this.band / 2; return Math.max(0, Math.min(this.w - 190, x + 14)); },
    },
    methods: {
      Y(v) { return this.T + this.ph - (v / this.top) * this.ph; },
      fmtV(v) { if (v === '' || v == null || isNaN(Number(v))) return '—'; return this.pct ? pct(v) : Number(v).toLocaleString('ja-JP'); },
      fmtTick(v) { return this.pct ? Math.round(v * 100) + '%' : Number(v).toLocaleString('ja-JP'); },
      aria(i) { return this.labels[i] + '：' + this.series.map(s => s.name + ' ' + this.fmtV(s.values[i]) + (this.pct ? '' : this.unit)).join('、'); },
    },

    },
    beforeUnmount() { if (this.ro) this.ro.disconnect(); },
    template: `
      <div class="tchart">
        <div class="lg" v-if="series.length > 1"><span v-for="s in series" :key="s.name" class="lg-i"><span class="key" :class="s.type === 'line' ? 'ln' : 'bx'" :style="{background: s.color}"></span>{{ s.name }}</span></div>

              <text v-for="(t, k) in ticks" :key="'t' + k" :x="L - 8" :y="Y(t) + 4" text-anchor="end" class="tc-tick">{{ fmtTick(t) }}</text>
              <text v-for="(l, i) in labels" :key="'x' + i" v-show="i % xEvery === 0 || i === n - 1" :x="L + i * band + band / 2" :y="height - 8" text-anchor="middle" class="tc-tick">{{ l }}</text>
            </g>
            <rect v-if="hi >= 0" :x="L + hi * band" :y="T" :width="band" :height="ph" class="tc-hl"></rect>
            <line v-if="hi >= 0 && lines.length" :x1="L + hi * band + band / 2" :x2="L + hi * band + band / 2" :y1="T" :y2="T + ph" class="tc-cross"></line>
            <g v-for="c in cols" :key="'c' + c.i"><path v-for="s in c.segs" :key="s.k" :d="s.d" :style="{fill: s.color}"></path></g>
            <g v-for="p in paths" :key="'p' + p.name">

              <circle v-for="q in p.pts" :key="q.i" :cx="q.x" :cy="q.y" r="4" class="tc-dot" :style="{fill: p.color}"></circle>
            </g>
            <text v-for="(e, k) in endLabels" :key="'e' + k" :x="e.x" :y="e.y" :text-anchor="e.a" class="tc-val">{{ e.t }}</text>
            <rect v-for="(l, i) in labels" :key="'h' + i" :x="L + i * band" :y="0" :width="band" :height="height" class="tc-hit" tabindex="0" :aria-label="aria(i)"
              @pointerenter="hi = i" @pointerleave="hi = -1" @focus="hi = i" @blur="hi = -1"></rect>
          </svg>
          <div class="tt" v-if="hi >= 0" :style="{left: ttLeft + 'px'}">
            <div class="tt-h">{{ labels[hi] }}</div>
            <div class="tt-r" v-for="s in series" :key="s.name"><span class="key ln" :style="{background: s.color}"></span><b>{{ fmtV(s.values[hi]) }}{{ pct || fmtV(s.values[hi]) === '—' ? '' : unit }}</b><span>{{ s.name }}</span></div>
            <div class="tt-r" v-if="stacked && bars.length > 1"><span class="key"></span><b>{{ fmtV(totals[hi]) }}{{ pct ? '' : unit }}</b><span>合計（棒）</span></div>
          </div>
        </div>
        <details class="tview"><summary>表で見る</summary>
          <div class="tblwrap flat"><table class="list"><thead><tr><th></th><th class="num" v-for="s in series" :key="s.name">{{ s.name }}</th><th class="num" v-if="stacked && bars.length > 1">合計（棒）</th></tr></thead>

        </details>
      </div>`,

  // 月の並びの頭の「全部0の月」を落とす（使い始める前の月でグラフが埋まらないように）。少なくとも min か月は残す
  function trimLead(list, has, min) {
    const first = list.findIndex(has);
    if (first < 0) return list.slice(-min);
    return list.slice(Math.max(0, Math.min(first, list.length - min)));

  // ---------------------------------------------------------------- 1件の詳しい画面（右から出る）
  const KIND_LABEL = { deal: '商談', camp: '施策', agency: '代理店', cust: '顧客', req: '依頼（制作）' };
  const GROUP_LABEL = {
    deal: { 'マーケ': 'マーケ（リードを入れる）', 'IS': 'IS（アポを取る）', 'FS': 'FS（商談する）', '受注': '受注', '自動': '自動で入る' },

  const RecordPanel = {
    data() { return { side: 'act', hist: null, closed: {}, status: '', memo: '', actUsd: '', actEl: '', busy: false, pays: null }; },

      p() { return S.panel; },

      title() { const r = this.row; if (!r) return ''; return this.kind === 'req' ? r.id : (this.kind === 'deal' || this.kind === 'agency' ? sama(r.name) : (this.kind === 'camp' ? campLabel(r.name) : r.name)); },
      // 【2026-11-20】消せる件（依頼は消さずに「取消」）。「制作」だけの人には出さない
      canDelete() { return ['deal', 'camp', 'agency', 'cust'].indexOf(this.kind) >= 0 && !prodOnly(); },
      kindWord() { return this.kind === 'camp' && this.row ? campKindLabel(this.row) : (KIND_LABEL[this.kind] || ''); },

        const fs = fieldsOf(this.kind);

        // 「自動で入る」（読むだけの項目）はいちばん下

        const hide = this.kind === 'agency' ? ['kind'] : [];

        const first = this.kind === 'deal' ? ['leadDate', 'company', 'name', 'title', 'background', 'business', 'industry'] : [];

          .filter(x => x.fs.length);

      // 【2026-11-19】施策の参加者・代理店から紹介された人を、同じ項目（会社名・お名前・役職・事前課題・事業内容）で並べる

      // 【2026-11-19 同日】セミナー・交流会は「参加者リスト」（参加者タブ）が先（青柳さん「参加者リストだけ」＝参加者は商談に入れない）。
      //   並び＝参加者リスト（その場で直せる）→ この会の商談（前から入っている人・商談にした人はリストの行に出す）→ 取り込んだ名前（「詳しく入れる」でリストにできる）
      people() {
        const r = this.row, k = this.kind;
        if (!r || (k !== 'camp' && k !== 'agency')) return [];
        const cls = st => (st === '契約' || st === '受注' ? 'st-受注' : (st === 'アポ' ? 'st-アポ' : (st === '不参加' || st === '対象外' ? 'st-対象外' : (STAGES.indexOf(st) >= 0 ? 'st-' + st : ''))));
        const out = [];
        const seen = {};
        const seenDeal = {};

        const tagOf = {};
        imported.forEach(x => { if (x.name) tagOf[normName(x.name)] = x; });
        if (k === 'camp') {
          const dealById = {};
          (S.data.deal || []).forEach(d => { dealById[d.id] = d; });
          (S.data.people || []).filter(p => p.camp === r.id).forEach(p => {

            const im = tagOf[normName(p.name)];
            const st = d ? d.stage : (p.state === '不参加' ? '不参加' : ((im && im.tag) || p.state || '参加'));
            out.push({ key: 'p' + p.id, person: p, deal: d, company: p.company || '', name: p.name, title: p.title || '', background: p.background || '',

            seen[normName(p.name)] = true;

          // 施策＝括弧は社内の担当・［］は結果／代理店＝括弧は事業内容

            staff: k === 'camp' ? x.note : '', status: st, cls: cls(st), imported: true, absent: st === '不参加', raw: x, idx: i });   // idx＝取り込みの何行目か（消すとき）
        });
        return out;
      },
      deals() {
        const r = this.row;
        if (!r) return [];
        const all = S.data.deal || [];
        if (this.kind === 'cust') return all.filter(d => d.customer === r.name);
        if (this.kind === 'camp' || this.kind === 'agency') return all.filter(d => d.sourceDetail === r.name);
        return [];
      },
      reqs() { return this.kind === 'cust' && this.row ? (S.data.req || []).filter(x => x.cust === this.row.name).slice().sort((a, b) => String(b.received).localeCompare(String(a.received))) : []; },
      custsOfAgency() { return this.kind === 'agency' && this.row ? (S.data.cust || []).filter(c => c.agency === this.row.name) : []; },
      linked() {
        const r = this.row;
        if (!r || this.kind !== 'deal') return {};
        return {
          cust: r.customer ? findRow('cust', r.customer) || { name: r.customer } : null,
          camp: (S.data.camp || []).filter(c => c.name === r.sourceDetail)[0] || null,
          agency: (S.data.agency || []).filter(a => a.name === r.sourceDetail)[0] || null,
        };
      },
      // 【2026-11-19】この件のやること（タスクの画面と同じもの）
      panelTasks() {
        if (!this.row || !S.data.tasks) return [];
        const key = String(keyOf(this.kind, this.row));
        return taskItems().filter(x => x.ref && x.ref.kind === this.kind && String(x.ref.key) === key);
      },
      // この依頼のフォームの回答（null＝まだ読み込んでいない／false＝付け合わせた回答が無い）
      formOf() {
        if (this.kind !== 'req' || !this.row) return false;
        if (!S.data.form) return null;
        return S.data.form.reqs.filter(x => x.reqId === this.row.id)[0] || false;
      },
      recsOf() { return this.kind === 'req' && this.row && S.data.form ? S.data.form.recs.filter(x => x.reqId === this.row.id) : []; },
      reqInfo() {
        const r = this.row;
        if (!r || this.kind !== 'req') return [];
        return [['受付日時', r.received], ['型', r.type], ['担当営業', r.sales], ['声', r.voice], ['作り方', r.make], ['そろった日', mdy(r.ready)], ['台本OK日', mdy(r.ok)],
          ['納品予定', mdy(r.due)], ['お客様待ち（営業日）', r.waitDays], ['修正回数', r.revisions], ['期間の何本目', r.count], ['状態を変えた日', mdy(r.statusDate)], ['納品日', mdy(r.delivered)]];
      },
    },
    watch: {
      'S.panel': { handler(v) { if (v) this.prepare(); }, immediate: true },
    },
    methods: {
      async prepare() {
        this.hist = null;
        this.pays = null;
        this.side = 'act';
        const k = this.kind;
        if (!S.data[k]) await ensure(k);
        if (k === 'deal') { ensure('camp').catch(() => {}); ensure('agency').catch(() => {}); ensure('cust').catch(() => {}); }
        if (k === 'cust' || k === 'camp' || k === 'agency') ensure('deal').catch(() => {});
        if (k === 'camp') ensure('people').catch(() => {});   // 【2026-11-19】参加者リスト
        if (k === 'cust') ensure('req').catch(() => {});
        if (k === 'agency') ensure('cust').catch(() => {});
        const r = this.row;
        if (k === 'req' && r) { this.status = r.status; this.memo = ''; this.actUsd = r.actUsd; this.actEl = r.actEl; }
        if (k === 'req') loadForm().catch(() => {});
        // 【2026-11-19 レビュー】ほかの画面で直したあと（印 dirty が付いている）なら読み直す＝「この件のやること」を古いまま出さない
        loadTasks(takeDirty('task')).catch(() => {});
        this.loadHist();
      },
      // 【2026-11-19】この件につながるタスクを足す（担当は、商談＝商談者・顧客＝担当営業・施策＝PM。いなければ自分）
      addTaskHere() {
        const r = this.row, k = this.kind;
        const cand = k === 'deal' ? (r.closer || r.apoOwner) : (k === 'cust' ? r.sales : (k === 'camp' ? String(r.pm || '').replace(/[（(].*?[）)]/g, '') : (k === 'req' ? r.sales : '')));
        addTask({ refKind: k, refKey: String(keyOf(k, r)), refLabel: KIND_LABEL[k] + '：' + this.title, person: (S.lists['人'] || []).indexOf(cand) >= 0 ? cand : me() });
      },
      async doneTask(x) { try { await setTaskDone(x, true); } catch (e) { /* 知らせは run */ } },
      qaParts(a) { return String(a).split(/(https?:\/\/[^\s,、]+)/).filter(s => s !== '').map(s => ({ t: s, u: safeUrl(s) })); },
      async loadHist() {
        const r = this.row;
        if (!r) return;
        const target = this.kind === 'deal' || this.kind === 'req' ? r.id : r.name;
        try { this.hist = await run('appHistory', target); } catch (e) { this.hist = []; }
      },
      async loadPays() {
        if (!this.row) return;
        if (!S.data.payWide) {
          const now = S.today.slice(0, 7);
          S.data.payWide = await run('appPayments', addMonthsYm(now, -6), addMonthsYm(now, 3));
        }
        this.pays = S.data.payWide.rows.filter(p => p.customer === this.row.name);
      },
      showSide(s) { this.side = s; if (s === 'rel' && this.kind === 'cust' && !this.pays) this.loadPays(); },
      close() { closePanel(); },
      async save(f, v, res, rej) {
        try { await saveField(this.kind, this.row, f[0], v); res(); this.loadHist(); } catch (e) { rej(e); }
      },
      async move(st) { await moveDeal(this.row, st); if (S.panel && S.panel.kind === 'deal') this.loadHist(); },
      rankOf(d) { return rankOf(d); },
      validity(d) { return dealValidity(d); },
      async setRank(k) { await setDealRank(this.row, k); if (S.panel && S.panel.kind === 'deal') this.loadHist(); },
      open(kind, key) { openPanel(kind, key); },
      toggle(g) { this.closed[g] = !this.closed[g]; },
      async setReq() {
        const r = this.row;
        if (this.status === r.status && !this.memo.trim()) { toast('状態もメモも変わっていません'); return; }
        this.busy = true;
        try {
          const res = this.status !== r.status ? await run('appReqStatus', r.id, this.status, this.memo) : await run('appReqMemo', r.id, this.memo);
          ((res && res.notes) || []).forEach(n => toast(n, 'ok'));
          if (res && res.row) upsert('req', res.row); else await ensure('req', true);
          toast('台帳に入れました', 'ok');
          this.memo = '';
          markDirty(['home', 'ops']);
          this.prepare();
        } finally { this.busy = false; }
      },
      async saveCost() {
        this.busy = true;
        try {
          const res = await run('appReqCost', this.row.id, { actUsd: this.actUsd, actEl: this.actEl });
          upsert('req', res.row);
          toast('実績を入れました（原価・粗利を出し直しました）', 'ok');
          markDirty(['money']);
        } finally { this.busy = false; }
      },
      money(v) { return v === '' || v == null ? '—' : yen(v); },
      // 施策の種類 → 商談の経路（設定の「経路」の名前）
      campSource(k) { return ['セミナー', '協賛セミナー', '交流会', '展示会'].indexOf(k) >= 0 ? k : (k === 'ランチ会' ? '交流会' : 'その他'); },
      // 施策の参加者を商談として入れる（経路と経路の詳細が入った状態で開く。入れたあとも施策の画面のまま）
      //   【2026-11-19】代理店の画面からは「紹介された人」（経路＝代理店の紹介・経路の詳細＝代理店名）
      addParticipant() {
        const r = this.row;
        if (!S.data.deal) ensure('deal').catch(() => {});
        // 【2026-11-19】入れるのは 会社名・お名前・役職・事前課題・事業内容 だけ（青柳さん「なんでセミナーなのにメルマガとかいろいろ出てくるの」）。
        //   経路・経路の詳細・リード獲得者は自動（hidden）。入れた人は、この画面の表と数に出て、商談の一覧にもリードとして入る
        if (this.kind === 'agency') {
          S.create = { kind: 'person', stay: true, stayLabel: 'この代理店から紹介された人', title: '紹介された人を入れる：' + sama(r.name),
            hidden: { source: '代理店の紹介', sourceDetail: r.name, leadOwner: me() },
            note: '入れた人は、この画面の「この代理店から紹介された人」に出ます。商談の一覧にも「リード」として入るので、アポ・契約になったら、この代理店の紹介の数・契約（代理店フィー）に入ります。' };
          return;
        }
        // 【2026-11-19 同日】青柳さん「参加者リストだけ」＝セミナー・交流会の参加者は参加者リスト（参加者タブ）に入れる。商談には入れない
        const what = campKindLabel(r);
        if (!S.data.people) ensure('people').catch(() => {});
        S.create = { kind: 'person', entity: 'people', stay: true, stayLabel: 'この' + what + 'の参加者リスト', title: '参加者を入れる：' + campLabel(r.name),
          hidden: { camp: r.id, staff: me() },
          note: '入れた人は、この' + what + 'の「参加した人」のリストに出て、参加の数に入ります（商談には入りません）。アポが取れたら、リストの「商談にする」を押すと商談の一覧に入り、そのあとのアポ・契約はこの' + what + 'の成果として数えます。' };
      },
      // 【2026-11-19 同日】参加者リストの1項目を直す
      async savePerson(p, key, v, res, rej) { try { await saveField('people', p, key, v); res(); } catch (e) { rej(e); } },
      // アポが取れた → 商談にする（商談の一覧に入る。参加者の行には商談IDが入る）
      async toDeal(p) {
        if (!(await ask('「' + sama(p.name) + '」を商談にしますか？', 'アポが取れた人だけ商談にします。商談の一覧に「アポ」で入り、会社名・役職・事前課題・事業内容もそのまま写します。', '商談にする'))) return;
        try {
          const r = await run('appPeopleToDeal', p.id);
          await ensure('deal');
          upsert('deal', r.deal);
          upsert('people', r.person);
          ((r && r.notes) || []).forEach(n => toast(n, 'ok'));
          toast('「' + sama(p.name) + '」を商談にしました（商談の一覧で続きを入れられます）', 'ok');
          afterChange('deal', 'new');
          afterChange('people', 'deal');
        } catch (e) { /* 知らせは run */ }
      },
      // 取り込んだ名前（シートから）を参加者リストに入れる＝会社名・役職などを書けるようにする
      async fromImported(x) {
        const st = x.status === '不参加' ? '不参加' : '参加';
        try {
          const res = await run('appSave', 'people', '', { camp: this.row.id, name: x.name, staff: x.staff || '', state: st });
          await ensure('people');
          upsert('people', res.row);
          toast('「' + sama(x.name) + '」をリストに入れました。会社名・役職などを押して入れてください', 'ok');
          afterChange('people', 'new');
        } catch (e) { /* 知らせは run */ }
      },
      // 【2026-11-20】消す（青柳さん「削除できるの？」「削除も」）。中身は履歴に残る。つながりの扱いは 営業.gs の appDelete
      async removeRecord() {
        const k = this.kind, r = this.row, name = this.title, what = this.kindWord;
        const detail = {
          deal: '商談の一覧から消えます。' + (r.customer ? '受注でできた顧客「' + r.customer + '」は消しません。' : '') + '参加者リストから商談にした人は、参加者リストに戻ります。',
          camp: 'この' + what + 'と、参加者リスト（' + (S.data.people || []).filter(p => p.camp === r.id).length + '人）を消します。この会から入った商談は残ります。',
          agency: 'この代理店から紹介された商談は残ります。紹介したお客様がいる代理店は消せません（やめた代理店は、状態を「終了」にします）。',
          cust: '依頼がある顧客は消せません（契約が終わったら、契約状態を「終了」にします）。顧客フォルダはドライブに残ります。',
        }[k] || '';
        if (!(await ask('「' + name + '」を消しますか？', detail + '消した中身は履歴に残ります。', '消す', true))) return;
        try {
          await deleteRecord(k, r);
          toast('「' + name + '」を消しました', 'ok');
          closePanel();
        } catch (e) { /* 知らせは run */ }
      },
      // 依頼は消さずに「取消」にする（依頼IDは「その顧客のいちばん大きい番号＋1」で振る＝消すと次の依頼に同じ番号が付いて、依頼フォルダとぶつかる）
      async cancelReq() {
        const r = this.row;
        if (!(await ask('「' + r.id + '」を取消にしますか？', '依頼は消さずに「取消」にします（依頼IDと依頼フォルダを残すため）。取消の依頼は、期間の本数に数えません。', '取消にする', true))) return;
        this.status = '取消';
        await this.setReq();
      },
      async removePerson(p) {
        if (!(await ask('「' + sama(p.name) + '」を参加者リストから消しますか？', (p.deal ? '商談にした人です。商談（' + p.deal + '）は残ります。' : '') + '消した中身は履歴に残ります。', '消す', true))) return;
        try { await deleteRecord('people', p); toast('「' + sama(p.name) + '」を消しました', 'ok'); } catch (e) { /* 知らせは run */ }
      },
      async removeDeal(d) {
        if (!(await ask('「' + sama(d.name) + '」の商談を消しますか？', '商談の一覧からも消えます（この画面の人の数からも外れます）。消した中身は履歴に残ります。', '消す', true))) return;
        try { await deleteRecord('deal', d); toast('「' + sama(d.name) + '」の商談を消しました', 'ok'); } catch (e) { /* 知らせは run */ }
      },
      // 売上管理シートから取り込んだ名前の行（施策・代理店の「取り込み」の欄の1行）を消す
      async removeImported(x) {
        if (!(await ask('「' + sama(x.name) + '」を消しますか？', '売上管理シートから取り込んだ名前の行を消します（この画面の人の数からも外れます）。', '消す', true))) return;
        const arr = String(this.row.imported || '').split('\n').map(s => s.trim()).filter(Boolean);
        arr.splice(x.idx, 1);
        try { await saveField(this.kind, this.row, 'imported', arr.join('\n')); } catch (e) { /* 知らせは run */ }
      },
      async removeTask(x) { try { await deleteTask(x); } catch (e) { /* 知らせは run */ } },
      // 【2026-11-19】外の人の名前の欄（出すときだけ「様」）
      samaField(f) {
        const k = this.kind, r = this.row || {};
        if (k === 'deal') return f[0] === 'name' || (f[0] === 'sourceDetail' && SAMA_SOURCES.indexOf(String(r.source || '')) >= 0);
        if (k === 'agency') return f[0] === 'name' || f[0] === 'owner';
        if (k === 'camp') return f[0] === 'partner' || f[0] === 'speaker';
        if (k === 'cust') return f[0] === 'agency';
        return false;
      },
      // 施策名・経路の出し方（施策名の頭の人に様）
      fmtField(f) {
        const k = this.kind, r = this.row || {};
        if (k === 'camp' && f[0] === 'name') return 'camp';
        if (k === 'deal' && f[0] === 'sourceDetail' && SAMA_SOURCES.indexOf(String(r.source || '')) < 0) return 'camp';
        if (k === 'cust' && f[0] === 'source') return 'route';
        return '';
      },
      ratio(v) { return v === '' || v == null ? '—' : (Math.round(v * 1000) / 10) + '%'; },
      stageIdx(st) { return STAGES.indexOf(st); },
    },

                    <span class="vchip" :class="'v-' + validity(row)" v-if="validity(row)">{{ validity(row) === '有効' ? '✓ 有効商談' : '無効（商談対象外）' }}</span></template>

                <a v-if="kind === 'req' && safeUrl(row.folder)" class="btn" :href="safeUrl(row.folder)" target="_blank" rel="noopener">依頼フォルダ</a>
                <!-- 【2026-11-20】消す（中身は履歴に残る）。依頼は消さずに「取消」（依頼IDと依頼フォルダを残す） -->
                <button v-if="canDelete" class="btn danger" @click="removeRecord" :title="'この' + kindWord + 'を消す（中身は履歴に残ります）'">消す</button>

  const ROUTE_NONE = '（リード元なし）';

  const TasksView = {

    ['week', '今週の商談', d => d.meetPlan && d.meetPlan >= S.today && d.meetPlan <= addDays(S.today, 7)],
    ['open', '進行中', d => ['アポ', '着座', '見込み'].indexOf(d.stage) >= 0],
    ['valid', '有効商談', d => dealValidity(d) === '有効'],
    ['nobody', '商談者が未定', d => ['アポ', '着座', '見込み'].indexOf(d.stage) >= 0 && !d.closer],
    ['won', '受注', d => d.stage === '受注'],
    ['lost', '失注', d => d.stage === '失注'],
    ['out', '対象外', d => d.stage === '対象外'],
  ];
  const DealsView = {
    mixins: [sortMixin],
    data() { return { mode: 'board', tab: 'all', person: '', source: '', period: '', q: '', sort: { key: 'meetPlan', dir: -1 }, dragId: null, over: null, limit: {}, picked: [], bulkField: 'closer', bulkPerson: '', busy: false }; },
    computed: {
      all() { return S.data.deal || []; },
      // 期間＝その商談が入った日（リード獲得日。空ならアポ獲得日・商談予定日）で絞る（分析と同じ）
      span() {
        const t = S.today.slice(0, 7);
        if (this.period === 'this') return [t + '-01', t + '-31'];
        if (this.period === 'last') { const m = addMonthsYm(t, -1); return [m + '-01', m + '-31']; }
        if (this.period === '3m') return [addMonthsYm(t, -2) + '-01', t + '-31'];
        return null;
      },
      base() {
        const sp = this.span;
        return this.all.filter(d => (!this.person || involves(d, this.person)) && (!this.source || d.source === this.source)
          && (!sp || ((x => x && x >= sp[0] && x <= sp[1])(d.leadDate || d.apoDate || d.meetPlan || '')))
          && textHit(d, ['name', 'company', 'memo', 'hearing', 'sourceDetail', 'industry', 'id', 'email'], this.q));
      },
      // 【2026-11-18 6回目】商談進捗（青柳さん「商談進捗にも有効商談いれたほういいね」）＝絞った商談の アポ → 着座 → 有効商談 → 受注
      prog() {
        const z = { deals: 0, apo: 0, sit: 0, valid: 0, invalid: 0, won: 0 };
        this.base.forEach(d => {
          const c = S.cats[String(d.result || '').trim()] || '';
          const w = c === '受注';
          z.deals++;
          if (w || d.meetPlan || d.apoDate || d.meetDate) z.apo++;
          if (dealSat(d)) { z.sit++; if (c === '無効') z.invalid++; else z.valid++; }
          if (w) z.won++;
        });
        const r = (a, b) => (b ? a / b : '');
        return Object.assign(z, { apoRate: r(z.apo, z.deals), sitRate: r(z.sit, z.apo), validRate: r(z.valid, z.sit), winRate: r(z.won, z.apo), validWin: r(z.won, z.valid) });
      },
      tabs() { return DEAL_TABS.map(t => [t[0], t[1], this.base.filter(t[2]).length]); },
      rows() { const t = DEAL_TABS.filter(x => x[0] === this.tab)[0]; return this.base.filter(t[2]); },
      sorted() { return sortRows(this.rows, this.sort.key, this.sort.dir); },
      cols() {
        const by = {};
        STAGES.forEach(s => { by[s] = []; });
        this.rows.forEach(d => { (by[d.stage] || (by[d.stage] = [])).push(d); });
        // 列の並び（前の画面と同じ）：アポ・着座＝商談予定日／見込み＝次の連絡日／ほか＝リード獲得日。動かしたばかりのカードは上
        const keyOf = st => (st === 'アポ' || st === '着座' ? 'meetPlan' : (st === '見込み' ? 'nextDate' : 'leadDate'));
        const dirOf = st => (st === 'アポ' || st === '見込み' ? 1 : -1);
        Object.keys(by).forEach(k => {
          const sorted = sortRows(by[k], keyOf(k), dirOf(k));
          const moved = sorted.filter(d => S.moved[d.id]).sort((a, b) => S.moved[b.id] - S.moved[a.id]);
          by[k] = moved.concat(sorted.filter(d => !S.moved[d.id]));
        });
        return STAGES.map(s => ({ stage: s, list: by[s], sum: by[s].reduce((n, d) => n + (Number(d.wonInit) || 0) + (Number(d.wonFee) || 0) * (S.options.kpiMonths || 3), 0) }));
      },
    },
    methods: {
      open(d) { openPanel('deal', d.id); },
      rankOf(d) { return rankOf(d); },
      validity(d) { return dealValidity(d); },
      pr(v) { return v === '' || v == null ? '—' : pct(v); },
      // 【2026-11-18】状況で色を変える（青柳さん「状況によって色変えたいよね。それで認識できるし」）＝気にかける所を札で出す
      lateOf(d) {
        const t = S.today;
        if (d.stage === 'アポ' && d.meetPlan && d.meetPlan < t) {
          const c = S.cats[String(d.result || '').trim()] || '';
          return c === 'リスケ' || c === '未着座' ? '予定日を過ぎた（' + d.result + '）＝次の予定日を入れる' : '商談予定日を過ぎた＝結果を入れる';
        }
        if (d.stage === '着座') return '結果を入れる';
        if (d.stage === '見込み' && d.nextDate && d.nextDate <= t) return '次の連絡日が来た';
        return '';
      },
      needCloser(d) { return ['アポ', '着座', '見込み'].indexOf(d.stage) >= 0 && !d.closer; },
      setRank(d, k) { setDealRank(d, k); },
      cardDate(d) {
        if (d.stage === 'リード') return d.leadDate ? 'リード ' + mdy(d.leadDate) : '';
        if (d.stage === 'アポ') return d.meetPlan ? '予定 ' + mdy(d.meetPlan) : (d.apoDate ? 'アポ ' + mdy(d.apoDate) : '');
        if (d.stage === '着座') return d.meetDate ? '実施 ' + mdy(d.meetDate) : '';
        if (d.stage === '見込み') return d.nextDate ? '次 ' + mdy(d.nextDate) : '';
        if (d.stage === '受注') return d.wonDate ? '受注 ' + mdy(d.wonDate) : '';
        return d.resultDate ? mdy(d.resultDate) : '';
      },
      dragStart(e, d) { this.dragId = d.id; try { e.dataTransfer.setData('text/plain', d.id); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* 古いブラウザ */ } },
      dragEnd() { this.dragId = null; this.over = null; },
      dragOver(e, st) { e.preventDefault(); this.over = st; },
      drop(e, st) {
        e.preventDefault();
        const id = this.dragId || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
        this.dragId = null; this.over = null;
        const d = this.all.filter(x => x.id === id)[0];
        if (d) moveDeal(d, st);
      },
      shown(c) { return c.list.slice(0, this.limit[c.stage] || 30); },
      async saveCell(d, key, v, res, rej) { try { if (key === 'stage') { await moveDeal(d, v); } else await saveField('deal', d, key, v); res(); } catch (e) { rej(e); } },
      // 【2026-11-18】担当をまとめて決める（取り込んだ商談は担当が空＝売上管理シートのリストに列が無い）
      allPicked() { const v = this.sorted.slice(0, 300); return v.length > 0 && v.every(d => this.picked.indexOf(d.id) >= 0); },
      pickAll(on) { this.picked = on ? this.sorted.slice(0, 300).map(d => d.id) : []; },
      async onBulkPerson() {
        if (this.bulkPerson !== ADD_PERSON) return;
        this.bulkPerson = '';
        const n = await addPerson(this.bulkField === 'closer' ? ['FS'] : (this.bulkField === 'apoOwner' ? ['IS'] : ['マーケ']));
        if (n) this.bulkPerson = n;
      },
      async bulkApply() {
        const label = { closer: '商談者', apoOwner: 'アポ獲得者', leadOwner: 'リード獲得者' }[this.bulkField];
        const ids = this.picked.slice();
        if (!ids.length || !this.bulkPerson) return;
        const filled = this.all.filter(d => ids.indexOf(d.id) >= 0 && d[this.bulkField] && d[this.bulkField] !== this.bulkPerson).length;
        if (!(await ask(ids.length + '件の' + label + 'を「' + this.bulkPerson + '」にしますか？', filled ? 'このうち ' + filled + '件は、ほかの人が入っています（書き換えます）。' : '', 'まとめて決める'))) return;
        this.busy = true;
        try {
          const ch = {};
          ch[this.bulkField] = this.bulkPerson;
          const res = await run('appDealBulk', ids, ch);
          ((res && res.rows) || []).forEach(r => upsert('deal', r));
          toast((res ? res.n : 0) + '件の' + label + 'を「' + this.bulkPerson + '」にしました', 'ok');
          this.picked = [];
          afterChange('deal', this.bulkField);
        } catch (e) { /* 知らせは run が出す */ } finally { this.busy = false; }
      },
      newDeal() { S.create = { kind: 'deal' }; },
    },
    created() { ensure('deal'); },
    activated() { if (!S.data.deal) ensure('deal'); },
    template: `

        <div class="card prog" aria-label="商談進捗">

  // ---------------------------------------------------------------- 施策・代理店
  const CAMP_TABS = [
    ['coming', 'これから', c => !c.date || c.date >= S.today],
    ['done', '終わった', c => c.date && c.date < S.today],
    ['all', 'すべて', () => true],
  ];
  // 【2026-11-19】青柳さん「営業枠の代理店の下に連続で同じようなイメージタブ追加したほうがいい」「交流会ないね」＝
  //   施策を左のメニューで「セミナー」「交流会」に分けて、代理店の下に並べる（種類で分ける。ほかの種類があれば「その他の施策」）
  const CAMP_GROUPS = {
    sem: { label: 'セミナー', kinds: ['セミナー', '協賛セミナー'], make: 'セミナー' },
    mix: { label: '交流会', kinds: ['交流会', 'ランチ会'], make: '交流会' },
    camp: { label: 'その他の施策', kinds: [], make: 'その他' },
  };
  function campGroup(c) {
    const k = String((c && c.kind) || '');
    if (CAMP_GROUPS.mix.kinds.indexOf(k) >= 0) return 'mix';
    if (CAMP_GROUPS.sem.kinds.indexOf(k) >= 0) return 'sem';
    return 'camp';
  }
  function campKindLabel(c) { return CAMP_GROUPS[campGroup(c)].label === 'その他の施策' ? '施策' : CAMP_GROUPS[campGroup(c)].label; }
  // 【2026-11-18】施策ごとの率と、目標との比較（青柳さん「各施策ごとの契約率とか率もいれないと」「目標と実績も必要だよね、それの比較も」）
  //   実績／目標 を並べ、目標はその場で押して入れる。達成の色は、開いたあとの施策だけに付ける（これからの施策は、まだ良し悪しが無い）
  const CAMP_GOALS = [['people', 'goalPeople', '参加'], ['apo', 'goalApo', 'アポ'], ['sit', '', '着座'], ['won', 'goalWon', '契約']];
  function reachCls(c, r) {
    if (r === '' || r == null) return '';
    if (!c.date || c.date >= S.today) return 'na';
    return r >= 1 ? 'ok' : (r >= 0.5 ? 'mid' : 'low');
  }
  // ---------------------------------------------------------------- 名刺リスト【2026-11-23】
  // 青柳さん「名刺交換しただけの人もリストとして入れておきたい」「撮影した写真をアップロードしたらリストなるみたいな」＝
  //   写真を入れると、裏（appCardUpload）が Google ドライブの文字読み取りで会社名・お名前・役職・メール・電話などに振り分けて1枚＝1行で入れる。
  //   読み違いはその場で押して直す。商談には入れない＝アポが取れたら「商談にする」（appCardToDeal）。料金はかからない（AI は使わない）
  const CardsView = {
    mixins: [sortMixin],
    data() { return { q: '', tab: 'open', date: S.today, place: '', owner: me(), busy: false, sort: { key: 'id', dir: -1 }, open: {} }; },
    computed: {
      all() { return S.data.card || []; },
      // 【2026-11-23】獲得した担当の選び先（使う人の一覧。選んでいる人が一覧に無ければ頭に足す＝空の表示にしない）
      people() { const a = (S.lists['人'] || []).slice(); if (this.owner && this.owner !== ADD_PERSON && a.indexOf(this.owner) < 0) a.unshift(this.owner); return a; },
      counts() { const a = this.all; return { all: a.length, open: a.filter(x => !x.deal).length, deal: a.filter(x => x.deal).length }; },
      rows() {
        let a = this.all;
        if (this.tab === 'open') a = a.filter(x => !x.deal);
        if (this.tab === 'deal') a = a.filter(x => x.deal);
        const q = this.q.trim();
        if (q) a = a.filter(x => textHit(x, ['company', 'name', 'title', 'email', 'phone', 'place', 'owner', 'memo', 'ocr', 'id'], q));
        return sortRows(a, this.sort.key, this.sort.dir);
      },
    },
    methods: {
      pick() { if (MIHON) { toast('見本の版では、写真の読み取りはできません（本番の画面ならできます）', 'info'); return; } this.$refs.file.click(); },
      // 【2026-11-23】獲得した担当（選んでいなければ自分）。「＋ 新しい人を足す…」を選んだら人を足す画面を出す
      who() { return this.owner && this.owner !== ADD_PERSON ? this.owner : me(); },
      async onOwner() { if (this.owner !== ADD_PERSON) return; this.owner = me(); const n = await addPerson(); if (n) this.owner = n; },
      addByHand() { S.create = { kind: 'card', stay: true, stayLabel: '名刺リスト', preset: { owner: this.who() } }; },
      async upload(ev) {
        const files = Array.from((ev.target && ev.target.files) || []);
        ev.target.value = '';
        if (!files.length) return;
        if (files.length > 10) { toast('一度に入れられるのは10枚までです（' + files.length + '枚選ばれています）', 'error'); return; }
        this.busy = true;
        try {
          // 【2026-11-23 レビュー】写真を縮める所の失敗だけ、ここで知らせる。裏（appCardUpload）の失敗は run が知らせる
          //   （前は catch でもう一度知らせていた＝同じ赤い知らせが2つ出た）
          const list = [];
          try { for (const f of files) list.push(await shrinkImage(f)); } catch (e) { toast(e && e.message ? e.message : String(e), 'error'); return; }
          toast(files.length + '枚を読み取っています（1枚に数秒かかります）', 'info');
          const r = await run('appCardUpload', list, { date: this.date, place: this.place.trim(), owner: this.who() });
          await ensure('card');
          ((r && r.rows) || []).forEach(x => upsert('card', x));
          ((r && r.notes) || []).forEach(n => toast(n, 'info'));
          toast(((r && r.rows) || []).length + '枚を名刺リストに入れました。読み違いは、押してその場で直してください', 'ok');
          this.tab = 'open';
          this.sort = { key: 'id', dir: -1 };
        } catch (e) { /* 知らせは run */ } finally { this.busy = false; }
      },
      async save(x, k, v, res, rej) { try { await saveField('card', x, k, v); res(); } catch (e) { rej(e); } },
      toggle(x) { const o = Object.assign({}, this.open); o[x.id] = !o[x.id]; this.open = o; },
      openDeal(id) { ensure('deal').then(() => openPanel('deal', id)); },
      // アポが取れた → 商談にする（商談の一覧に「アポ」で入る。名刺の行には商談IDが入る）
      async toDeal(x) {
        if (!String(x.name || '').trim()) { toast('お名前が空です。お名前を入れてから商談にしてください', 'error'); return; }
        if (!(await ask('「' + sama(x.name) + '」を商談にしますか？', 'アポが取れた人だけ商談にします。商談の一覧に「アポ」で入り、会社名・役職・メールを写します（電話・住所・交換した場所は商談のメモへ）。獲得した担当は、商談のリード獲得者に入ります。', '商談にする'))) return;
        try {
          const r = await run('appCardToDeal', x.id);
          await ensure('deal');
          upsert('deal', r.deal);
          upsert('card', r.card);
          ((r && r.notes) || []).forEach(n => toast(n, 'ok'));
          toast('「' + sama(x.name) + '」を商談にしました（商談の一覧で続きを入れられます）', 'ok');
          afterChange('deal', 'new');
        } catch (e) { /* 知らせは run */ }
      },
      async remove(x) {
        const who = x.name ? sama(x.name) : (x.company || x.id);
        if (!(await ask('「' + who + '」の名刺を消しますか？', (x.deal ? '商談にした人です。商談（' + x.deal + '）は残ります。' : '') + '写真はドライブに残ります。消した中身は履歴に残ります。', '消す', true))) return;
        try { await deleteRecord('card', x); toast('「' + who + '」の名刺を消しました', 'ok'); } catch (e) { /* 知らせは run */ }
      },
    },
    created() { ensure('card').catch(() => {}); },
    activated() { if (takeDirty('card')) ensure('card', true).catch(() => {}); },

        <div class="page-head"><h1>名刺</h1><span class="muted">{{ counts.all }}枚</span>
          <div class="acts">
