        <div class="filters">
          <label class="muted small">交換日 <input class="f" type="date" v-model="date" aria-label="交換日"></label>
          <label class="muted small">交換した場所 <input class="f" v-model="place" placeholder="例：11月の交流会（施策名と同じならリード元になる）" style="min-width:260px" aria-label="交換した場所"></label>
          <label class="muted small">獲得した担当 <select class="f" v-model="owner" @change="onOwner" aria-label="名刺を獲得した担当"><option v-for="p in people" :key="p" :value="p">{{ p }}{{ p === me() ? '（自分）' : '' }}</option><option :value="ADD_PERSON">＋ 新しい人を足す…</option></select></label>
          <span class="muted small">写真を入れる前に決めると、入れた名刺に入ります（ほかの人がもらった名刺は、担当をその人にしてから入れる）</span>
        </div>
        <view-tabs :tabs="[['open', '商談にしていない', counts.open], ['deal', '商談にした', counts.deal], ['all', 'すべて', counts.all]]" v-model="tab"></view-tabs>
        <div class="filters"><input class="f" v-model="q" placeholder="会社名・お名前・メール・場所・担当・読んだ文字で探す" aria-label="名刺を探す" style="min-width:260px"></div>
        <div v-if="!S.data.card" class="empty">読み込んでいます…</div>
        <div v-else class="tblwrap"><table class="list meishi">
          <thead><tr>
            <th class="sort" @click="sortBy('date')">交換日<span class="arrow">{{ arrow('date') }}</span></th>
            <th class="sort" @click="sortBy('company')">会社名<span class="arrow">{{ arrow('company') }}</span></th>
            <th class="sort" @click="sortBy('name')">お名前<span class="arrow">{{ arrow('name') }}</span></th>
            <th>役職</th><th>メール</th><th>電話</th>
            <th class="sort" @click="sortBy('place')">交換した場所<span class="arrow">{{ arrow('place') }}</span></th>
            <th class="sort" @click="sortBy('owner')">獲得した担当<span class="arrow">{{ arrow('owner') }}</span></th><th>写真</th><th></th>
          </tr></thead>
          <tbody>
            <template v-for="x in rows" :key="x.id">
              <tr>
                <td class="nowrap"><prop-field compact :f="['date', '交換日', 'date']" :value="x.date" @save="(v, res, rej) => save(x, 'date', v, res, rej)"></prop-field></td>
                <td><prop-field compact :f="['company', '会社名', 'text']" :value="x.company" emptyText="＋" @save="(v, res, rej) => save(x, 'company', v, res, rej)"></prop-field></td>
                <td class="name"><prop-field compact sama :f="['name', 'お名前', 'text']" :value="x.name" emptyText="＋" @save="(v, res, rej) => save(x, 'name', v, res, rej)"></prop-field></td>
                <td><prop-field compact :f="['title', '役職', 'text']" :value="x.title" emptyText="＋" @save="(v, res, rej) => save(x, 'title', v, res, rej)"></prop-field></td>
                <td><prop-field compact :f="['email', 'メールアドレス', 'text']" :value="x.email" emptyText="＋" @save="(v, res, rej) => save(x, 'email', v, res, rej)"></prop-field></td>
                <td><prop-field compact :f="['phone', '電話', 'text']" :value="x.phone" emptyText="＋" @save="(v, res, rej) => save(x, 'phone', v, res, rej)"></prop-field></td>
                <td><prop-field compact :f="['place', '交換した場所', 'text']" :value="x.place" emptyText="＋" @save="(v, res, rej) => save(x, 'place', v, res, rej)"></prop-field></td>
                <td><prop-field compact :f="['owner', '獲得した担当', 'person']" :value="x.owner" emptyText="＋" @save="(v, res, rej) => save(x, 'owner', v, res, rej)"></prop-field></td>

                <td class="nowrap acts">
                  <button v-if="x.deal" class="lnk" @click="openDeal(x.deal)" title="商談の画面を開く">商談 {{ x.deal }}</button>
                  <button v-else class="btn small" @click="toDeal(x)" title="アポが取れた人だけ商談にする（商談の一覧に入る）">商談にする</button>
                  <button class="btn small ghost" @click="toggle(x)" :aria-expanded="!!open[x.id]">{{ open[x.id] ? '閉じる' : 'くわしく' }}</button>
                  <button class="btn small danger ghost" @click="remove(x)" :aria-label="(x.name || x.company || x.id) + 'の名刺を消す'">消す</button>

  const CampsView = {
    mixins: [sortMixin],
    // mode＝この一覧が出す種類（sem＝セミナー・mix＝交流会・camp＝その他の施策）。左のメニューで開いたときの画面の名前で決まる
    data() { return { tab: 'coming', q: '', sort: { key: 'date', dir: 1 }, goals: CAMP_GOALS, mode: CAMP_GROUPS[S.view] ? S.view : 'sem' }; },
    computed: {
      grp() { return CAMP_GROUPS[this.mode]; },
      all() { return (S.data.camp || []).filter(c => campGroup(c) === this.mode); },
      base() { return this.all.filter(c => textHit(c, ['name', 'kind', 'theme', 'partner', 'memo', 'pm'], this.q)); },
      tabs() { return CAMP_TABS.map(t => [t[0], t[1], this.base.filter(t[2]).length]); },
      rows() {
        const t = CAMP_TABS.filter(x => x[0] === this.tab)[0];
        const list = this.base.filter(t[2]);
        const k = this.sort.key;
        // 数と率（s.〜）は stats の中の値で並べる
        if (k.indexOf('s.') === 0) { const f = k.slice(2); return sortRows(list.map(c => ({ _v: c.stats ? c.stats[f] : '', c: c })), '_v', this.sort.dir).map(x => x.c); }
        return sortRows(list, k, this.tab === 'done' && k === 'date' ? -1 * this.sort.dir : this.sort.dir);
      },
      // いま見えている施策の合計。目標との比べは「目標を入れた施策だけ」で足す（目標の無い施策の実績まで足すと、目標より大きく見える）
      sum() {
        const z = { people: 0, apo: 0, sit: 0, won: 0, amount: 0, g: {} };
        const GK = { people: 'goalPeople', apo: 'goalApo', won: 'goalWon', amount: 'goalAmount' };
        this.rows.forEach(c => {
          const s = c.stats || {};
          ['people', 'apo', 'sit', 'won', 'amount'].forEach(k => { z[k] += Number(s[k]) || 0; });
          Object.keys(GK).forEach(k => {
            const gv = c[GK[k]];
            if (gv === '' || gv == null || isNaN(Number(gv))) return;
            const x = z.g[k] || (z.g[k] = { n: 0, act: 0, goal: 0 });
            x.n++; x.act += Number(s[k]) || 0; x.goal += Number(gv);
          });
        });
        const r = (a, b) => (b ? a / b : '');
        return Object.assign(z, { apoRate: r(z.apo, z.people), winRate: r(z.won, z.apo), peopleWin: r(z.won, z.people) });
      },
    },
    methods: {
      open(c) { openPanel('camp', c.id); },
      async saveCell(c, key, v, res, rej) { try { await saveField('camp', c, key, v); res(); } catch (e) { rej(e); } },
      st(c) { return c.stats || { reach: {} }; },
      reach(c, k) { const s = this.st(c); return s.reach && s.reach[k] !== undefined ? s.reach[k] : ''; },
      reachCls(c, r) { return reachCls(c, r); },
      r(v) { return v === '' || v == null ? '—' : pct(v); },
      sortBy(k) { if (this.sort.key === k) this.sort.dir = -this.sort.dir; else { this.sort.key = k; this.sort.dir = k.indexOf('s.') === 0 ? -1 : 1; } },
    },
    created() { ensure('camp'); },
    activated() { if (!S.data.camp) ensure('camp'); },

              <th class="num sort" @click="sortBy('s.peopleWin')">参加→契約<br><span class="muted small">契約÷参加</span><span class="arrow">{{ arrow('s.peopleWin') }}</span></th></tr>

          受注金額＝参加者の商談の受注＋取り込んだ［契約］の人（台帳の顧客に名前が当たれば、その顧客の初期費用＋月額×{{ S.options.kpiMonths || 3 }}か月）。当たらない人は「金額不明」に数えます。</p>

  // 【2026-11-18】取次店は代理店に統一した（青柳さん「取次店と代理店は同じなので代理店統一して」）＝区分の列とタブをやめた
  // 【2026-11-18 同日6回目】代理店の稼働率・契約率・有効商談率（青柳さん「代理店の稼働率と契約率、有効商談率も出せるようにしたい」）＝期間を選んで出す（appAgencyStats）
  //   稼働＝その月に紹介（商談）か契約（お客様）が1件でもある。有効商談＝着座のうち無効（商談対象外）でないもの
  const AG_TABS = [['all', 'すべて', () => true], ['active', '稼働した', r => r.active], ['idle', '稼働していない', r => r.months.length > 0 && !r.active]];
  const AgenciesView = {
    mixins: [sortMixin],

      },

      barW(v) { return Math.max(2, Math.round(Math.min(1, Number(v) || 0) * 50)) + 'px'; },

    template: `

              <tr v-for="x in rows" :key="x.name" :class="{dim: !x.months.length}">

            有効商談＝着座のうち、結果が「商談対象外（無効商談）」でないもの（売上管理シートの「有効商談着座のみ」と同じ）。</p>

  };

  // ---------------------------------------------------------------- 顧客
  const liveCust = c => c.state !== '終了' && c.state !== 'トライアル';
  // 【2026-11-19】台帳の顧客タブと同じアラートの色（青柳さん「アラートは解約とか使用の…」→「色だけ入れる」）。
  //   依頼なし＝設定の日数（既定 7日で黄・14日で赤）で行に色。契約中・解約予定・空の状態だけ（台帳の条件と同じ）。
  //   顔も声も空＝名前のマスを紫（終了は除く・動画を作るサービスの方だけ＝まだ1本も作れない）。
  //   契約の終わり＝終了・解約予定なのに空／終了なのにまだ先（状態の付け間違い）なら赤
  const idleDays = c => (c.idle === '' || c.idle == null || isNaN(Number(c.idle)) ? null : Number(c.idle));
  function idleLevel(c) {
    const d = idleDays(c);
    if (d === null || ['契約中', '解約予定', ''].indexOf(String(c.state || '')) < 0) return '';
    const o = S.options || {};
    if (Number(o.idleLate) > 0 && d >= Number(o.idleLate)) return 'late';
    if (Number(o.idleWarn) > 0 && d >= Number(o.idleWarn)) return 'warn';
    return '';
  }
  const noFaceVoice = c => c.state !== '終了' && !!c.production && !String(c.avatar || '').trim() && !String(c.voiceId || '').trim();
  const endEmpty = c => (c.state === '終了' || c.state === '解約予定') && !c.end;
  const endedEarly = c => c.state === '終了' && !!c.end && String(c.end).slice(0, 10) >= S.today;
  // 【2026-11-23】青柳さん「解約済みという欄も作って」＝前の「終了」タブ（中身は同じ＝契約状態が「終了」＝解約して契約の終わりを過ぎた方。
  //   トライアルは台帳の別のタブなので、ここには入らない）。名前を「解約済み」にして「解約予定」の隣へ。契約状態の言葉（終了）は台帳と同じまま
  const CUST_TABS = [
    ['live', '契約が生きている', liveCust],
    ['cancel', '解約予定', c => c.state === '解約予定'],
    ['ended', '解約済み', c => c.state === '終了'],
    ['idle', '依頼が来ていない', c => idleLevel(c) !== ''],
    ['todo', '手続きが残っている', c => liveCust(c) && (c.autopay === '未登録' || c.gform === '未共有' || c.gform === '共有済' || (c.production && !c.avatar && !c.voiceId))],
    ['nopay', '支払い方法が空', c => liveCust(c) && !c.feePay],
    ['all', 'すべて', () => true],
  ];
  // 【2026-11-23】青柳さん「顧客の順番だが契約獲得順にして→それかあかさたなとか選べるようにしてもいい」
  //   並び＝契約を獲得した順（契約日の古い順＝No.1 がいちばん初めのお客様・既定）／契約日の新しい順／あいうえお順（読み）。
  //   同じ契約日は台帳の顧客タブの上から（先に入れた方が先）。見出しを押して並べ替えることもできる。選んだ並びは端末が覚える
  const CUST_ORDERS = [
    ['got', '契約を獲得した順', { key: 'contract', dir: 1 }],
    ['new', '契約日の新しい順', { key: 'contract', dir: -1 }],
    ['kana', 'あいうえお順（読み）', { key: 'kana', dir: 1 }],
  ];
  const custOrderOf = v => CUST_ORDERS.filter(x => x[0] === v)[0] || CUST_ORDERS[0];
  // あいうえお順の物差し：読み。カタカナはひらがなに、空白は外す（「アッドカラーパーティー　くやまあゆみ」→「あっどからーぱーてぃーくやまあゆみ」）
  const kanaSortKey = s => String(s || '').replace(/[\s　]/g, '').replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  // 読みのある方をあいうえお順に並べ、読みが空の方はその下に名前の順（株式会社などの頭は外して比べる）
  function sortByKana(rows, dir) {
    const nm = c => String(c.name || '').replace(/^(株式会社|有限会社|合同会社|一般社団法人|（株）|\(株\))\s*/, '');
    return rows.slice().sort((a, b) => {
      const ka = kanaSortKey(a.kana), kb = kanaSortKey(b.kana);
      if (!ka !== !kb) return ka ? -1 : 1;   // 読みが空はいつも下
      return (ka ? ka.localeCompare(kb, 'ja') : nm(a).localeCompare(nm(b), 'ja')) * dir;
    });
  }
  // 【2026-11-19】CS担当の絞り込みで「CS担当なし」を選んだとき
  const CS_NONE = '__no_cs__';
  const CustsView = {
    mixins: [sortMixin],
    data() { return { tab: 'live', q: '', sales: '', cs: '', service: '', sort: Object.assign({}, custOrderOf(prefGet('custOrder', 'got'))[2]), picked: [], bulkField: 'cs', bulkPerson: '', busy: false, CS_NONE: CS_NONE, CUST_ORDERS: CUST_ORDERS }; },
    computed: {
      all() { return S.data.cust || []; },
      base() { return this.all.filter(c => (!this.sales || c.sales === this.sales) && (!this.cs || (this.cs === CS_NONE ? !c.cs : c.cs === this.cs))
        && (!this.service || (c.service || 'Avatifi') === this.service) && textHit(c, ['name', 'company', 'kana', 'industry', 'salesMemo', 'email'], this.q)); },
      tabs() { return CUST_TABS.map(t => [t[0], t[1], this.base.filter(t[2]).length]); },
      rows() {
        const t = CUST_TABS.filter(x => x[0] === this.tab)[0] || CUST_TABS[0];
        const list = this.base.filter(t[2]);
        return this.sort.key === 'kana' ? sortByKana(list, this.sort.dir) : sortRows(list, this.sort.key, this.sort.dir);
      },
      // 【2026-11-23】並びの選択（見出しを押して並べ替えたときは空＝「見出しの順」）
      order: {
        get() { const o = CUST_ORDERS.filter(x => x[2].key === this.sort.key && x[2].dir === this.sort.dir)[0]; return o ? o[0] : ''; },
        set(v) { const o = CUST_ORDERS.filter(x => x[0] === v)[0]; if (!o) return; this.sort = Object.assign({}, o[2]); prefSet('custOrder', v); },
      },
      noKana() { return this.rows.filter(c => !kanaSortKey(c.kana)).length; },
      noCs() { return this.all.filter(c => liveCust(c) && !c.cs).length; },
    },
    methods: {
      open(c) { openPanel('cust', c.name); },
      async saveCell(c, key, v, res, rej) { try { await saveField('cust', c, key, v); res(); } catch (e) { rej(e); } },
      // 【2026-11-19】CS担当・担当営業をまとめて決める（CS担当は台帳に列ができたばかりで全員空）
      allPicked() { const v = this.rows.slice(0, 300); return v.length > 0 && v.every(c => this.picked.indexOf(c.name) >= 0); },
      pickAll(on) { this.picked = on ? this.rows.slice(0, 300).map(c => c.name) : []; },
      showNoCs() { this.cs = CS_NONE; this.tab = 'live'; },
      isLive(c) { return liveCust(c); },
      noFaceVoice(c) { return noFaceVoice(c); },
      endBad(c) { return endEmpty(c) || endedEarly(c); },
      endedEarly(c) { return endedEarly(c); },
      async onBulkPerson() {
        if (this.bulkPerson !== ADD_PERSON) return;
        this.bulkPerson = '';
        const n = await addPerson(PERSON_ROLE_OF[this.bulkField]);
        if (n) this.bulkPerson = n;
      },
      async bulkApply() {
        const label = this.bulkField === 'cs' ? 'CS担当' : '担当営業';
        const names = this.picked.slice();
        if (!names.length || !this.bulkPerson) return;

  // ---------------------------------------------------------------- 制作（依頼）

  //   【2026-11-19】青柳さん「動画制作は依頼から5日以内に納品なのでそのアラートも」＝納品予定（台帳の決まり：そろった日から5営業日目と、
  //   台本OKから3営業日の遅いほう）で、過ぎた＝赤・今日か明日まで＝黄。納品予定の横に「あと◯日」、タブ「納品の期限」
  const reqOpen = r => r.waiting !== '完了' && ['納品済み', '取消'].indexOf(r.status) < 0;
  const reqLate = r => !!r.due && String(r.due).slice(0, 10) < S.today && reqOpen(r);
  const reqSoon = r => !!r.due && reqOpen(r) && !reqLate(r) && String(r.due).slice(0, 10) <= addDays(S.today, 1);
  function reqDueText(r) {
    if (!r.due || !reqOpen(r)) return '';
    const a = parseYmd(String(r.due).slice(0, 10)), b = parseYmd(S.today);
    if (!a || !b) return '';
    const diff = Math.round((a - b) / 86400000);
    return diff < 0 ? (-diff) + '日過ぎ' : (diff === 0 ? '今日まで' : (diff === 1 ? '明日まで' : 'あと' + diff + '日'));

  // ---------------------------------------------------------------- 目標（KGI・KPI）【2026-11-18 同日2回目】

  //   KGI（ゴール）＝契約の件数・受注金額／KPI（行動）＝アポ・着座・セミナー開催。実績は商談・顧客・施策から自動で数える（手で打たない）
  //   経路ごとの表は、設定の「経路」の名前で、目標と実績を突き合わせる。営業（KPI目標の担当）1人ぶん

  const GOAL_COLS = [['apo', 'アポ', 'kpi'], ['sit', '着座', 'kpi'], ['valid', '有効商談', 'kpi'], ['won', '契約', 'kgi'], ['amount', '金額', 'kgi']];
  const GoalView = {
    data() { return { month: S.today.slice(0, 7), d: null, ownerPick: '', addRoute: '', busy: false, tab: 'route', NONE: ROUTE_NONE, COLS: GOAL_COLS }; },
    computed: {
      owner() { return this.d ? (this.d.owner || this.ownerPick) : ''; },
      editable() { return !!this.owner && (isAdmin() || this.owner === me()); },
      targetRows() { return this.d ? this.d.routes.filter(r => r.hasTarget) : []; },
      known() { return this.d ? this.d.routes.filter(r => r.known || r.route === ROUTE_NONE || !r.hasTarget) : []; },
      unknown() { return this.d ? this.d.routes.filter(r => !r.known && r.hasTarget && r.route !== ROUTE_NONE) : []; },
      // 【2026-11-20】青柳さん「KGIKPIの目標 実績 達成率で入れてほしい、今だとわからない」＝KGI と KPI を1つの表に（行＝指標・列＝目標・実績・達成率…）
      groups() {
        if (!this.d) return [];
        const row = (m, v) => ({ key: m[0], label: m[1], yen: m[2] === 'yen', unit: m[3] || '件', v: v });
        return [
          { key: 'kgi', label: 'ゴール（この月の結果）', rows: KGI_M.map(m => row(m, this.d.kgi[m[0]])) },
          { key: 'kpi', label: '行動（ゴールまでの数）', rows: KPI_M.map(m => row(m, this.d.kpi[m[0]])) },
        ];
      },
      // 今日時点＝この月の営業日（土日・祝日・会社の休みを除く）の何日目か
      paceHead() {
        const p = this.d && this.d.pace;
        if (!p) return '';
        if (p.ratio >= 1) return 'この月は終わりました（営業日 ' + p.total + '日）';
        if (p.ratio <= 0) return 'この月はまだ始まっていません（営業日 ' + p.total + '日）';
        return '今日（' + mdy(p.today) + '）時点：この月の営業日 ' + p.total + '日のうち ' + p.passed + '日が過ぎました（経過 ' + pct(p.ratio) + '）';
      },
      freeRoutes() { const used = this.d ? this.d.routes.filter(r => r.hasTarget).map(r => r.route) : []; return (S.lists['経路'] || []).filter(x => used.indexOf(x) < 0); },
      sum() {
        const o = { aA: 0, aT: '', sA: 0, vA: 0, wA: 0, wT: '', mA: 0, mT: '' };
        if (!this.d) return o;
        const add = (k, v) => { if (v === '' || v == null) return; o[k] = (o[k] === '' ? 0 : o[k]) + Number(v); };
        this.d.routes.forEach(r => { o.aA += r.actual.apo; o.sA += r.actual.sit; o.vA += r.actual.valid || 0; o.wA += r.actual.won; o.mA += r.actual.amount; add('aT', r.target.apo); add('wT', r.target.won); add('mT', r.target.amount); });

    methods: {
      async load() { this.d = await run('appGoals', this.month); this.addRoute = ''; },
      shift(n) { this.month = addMonthsYm(this.month, n); this.load(); },

      // KGI・KPI の合計の目標（KPI目標タブの、経路が空の行）
      async saveTop(key, v, res, rej) {

      },
      // 経路ごとの目標：その月・営業の経路の行をまるごと入れ替えて保存する
      rowsNow() { return this.targetRows.map(r => ({ route: r.route, note: r.note, apo: r.target.apo, rate: r.target.rate, won: r.target.won, amount: r.target.amount })); },
      async saveRoutes(rows, msg) {
        this.busy = true;

      },
      async saveRT(r, key, v, res, rej) {
        try {
          const rows = this.rowsNow();
          let row = rows.filter(x => x.route === r.route)[0];
          if (!row) { row = { route: r.route, note: '', apo: '', rate: '', won: '', amount: '' }; rows.push(row); }
          row[key] = v;
          // 契約率を入れたら、契約が空なら アポ×契約率（前の KPI シートと同じ）
          const a = Number(row.apo), t = Number(row.rate);
          if ((key === 'rate' || key === 'apo') && a && t && (row.won === '' || row.won == null)) row.won = Math.round(a * t * 10) / 10;
          await this.saveRoutes(rows);
          res();
        } catch (e) { rej(e); }
      },
      // 経路に当たらない目標の経路を選ぶ（同じ経路の目標があれば足してまとめる）
      async moveRoute(r, to) {
        if (!to) return;
        const rows = this.rowsNow();
        const from = rows.filter(x => x.route === r.route)[0];
        const into = rows.filter(x => x.route === to)[0];
        const memo = '元のリード元：' + r.route;
        if (into) {
          ['apo', 'won', 'amount'].forEach(k => { if (from[k] !== '' && from[k] != null) into[k] = (into[k] === '' || into[k] == null ? 0 : Number(into[k])) + Number(from[k]); });
          into.note = [into.note, memo, from.note].filter(x => x).join('／');
          rows.splice(rows.indexOf(from), 1);
        } else {
          from.route = to;
          from.note = [memo, from.note].filter(x => x).join('／');
        }
        await this.saveRoutes(rows, '「' + r.route + '」の目標を「' + to + '」にしました');
      },
      async removeRoute(r) {
        if (!(await ask('「' + r.route + '」の目標を消しますか？', 'この月の、このリード元の目標（アポ・契約・金額・特記）を消します。実績は消えません。', '消す', true))) return;
        await this.saveRoutes(this.rowsNow().filter(x => x.route !== r.route), '「' + r.route + '」の目標を消しました');
      },
      async addRow() {
        if (!this.addRoute) return;
        const rows = this.rowsNow();
        rows.push({ route: this.addRoute, note: '', apo: '', rate: '', won: '', amount: '' });
        await this.saveRoutes(rows, '「' + this.addRoute + '」を足しました。目標を押して入れてください');
      },
      fmt(v, kind) { return v === '' || v == null ? '' : (kind === 'yen' ? yen(v) : (Math.round(Number(v) * 10) / 10).toLocaleString('ja-JP')); },
      fmtA(v, kind) { return kind === 'yen' ? (yen(v) || '0円') : (v === '' || v == null ? 0 : v); },
      rate(a, b) { return b ? pct(a / b) : '—'; },
      openCust(name) { ensure('cust').then(() => openPanel('cust', name)); },
      // 【2026-11-20】今日までの目安・週の目安（件は小数1けた・金額は円）
      dueText(v, m) { return m.yen ? (yen(Math.round(v)) || '0円') : (Math.round(v * 10) / 10).toLocaleString('ja-JP') + m.unit; },
      dueShort(v, k) { return v === '' || v == null ? '—' : (k === 'amount' ? (yen(Math.round(v)) || '0円') : (Math.round(v * 10) / 10).toLocaleString('ja-JP')); },
      paceWord(p) { return p >= 1 ? '順調' : (p >= 0.8 ? 'もう少し' : '遅れ'); },
      // 【2026-11-20】今日までに達成しておくべき数との差（青柳さん「達成しておかないといけないのも対比で出して」）。足りない＝あと◯／超えた＝＋◯
      gapText(m) {

        const g = v.actual - v.due;
        const f = x => (m.yen ? (yen(Math.round(x)) || '0円') : (Math.round(x * 10) / 10).toLocaleString('ja-JP') + m.unit);
        return g < 0 ? 'あと ' + f(-g) : '＋' + f(g) + ' 多い';

      rateText(v) { return v === '' || v == null ? '—' : pct(v); },
      mOf(k) { return this.d ? (k === 'won' || k === 'amount' ? this.d.kgi[k] : this.d.kpi[k]) : null; },

          <template v-else>
            <p class="muted small" style="margin:0 0 10px">週の目標＝月の目標を営業日で分けた目安（月の目標 × その週の営業日 ÷ この月の営業日）。月の目標は上の表で入れます。</p>
            <div class="tblwrap"><table class="list routem">

          <p class="muted small" style="margin-top:10px">数え方：アポ＝商談予定日がこの月／着座＝商談実施日がこの月（未着座・リスケは数えない）／有効商談＝着座のうち商談対象外（無効）でないもの／契約＝顧客の契約日がこの月（空なら、つないだ商談の受注日）／
            金額＝初期費用＋月額×{{ d.months }}か月（税込）／セミナー開催＝種類が「セミナー」「協賛セミナー」で中止でない施策。営業は1人なので、商談の担当では分けずに全部を数えます。
            契約のリード元は、つないだ商談のリード元（無ければ顧客の「リード元」の書き方を読み替え）。</p>

  };

  // ---------------------------------------------------------------- 分析（どの経路から何％決まったか）【2026-11-18 同日3回目】
  // 青柳さん「どの経路から何％決まった～みたいな統計や分析も今後していくので、そこもできるようにしたい。分析して振り返れるように数字を」
  //   期間に入った商談を1つの群にして、アポ → 着座 → 契約まで何％進んだか（同じ商談を追うので、％がそのまま「決まった割合」）
  // 【2026-11-23】青柳さん「分析の商談アポと着座は商談予定日超過だけを対象に」＝アポ・着座は商談予定日を過ぎた商談だけ（裏の crmAnalysis_）。
  //   予定日がまだの商談は「予定日まだ」（notyet）に分けて出す
  const ANA_METRICS = [['deals', '商談（入った数）', 'n'], ['apo', 'アポ（商談予定日を過ぎた）', 'n'], ['notyet', '予定日まだ（アポに入れない）', 'n'], ['sit', '着座', 'n'], ['valid', '有効商談', 'n'], ['won', '契約', 'n'],
    ['apoRate', 'アポ率（アポ÷商談）', 'rate'], ['sitRate', '着座率（着座÷アポ）', 'rate'], ['validRate', '有効商談率（有効商談÷着座）', 'rate'], ['winRate', '契約率（契約÷アポ）', 'rate'], ['closeRate', '成約率（契約÷着座）', 'rate'],
    ['amount', '受注金額', 'yen'], ['extra', '商談に無い契約', 'n']];
  // 【2026-11-19】マーケ施策の数値化（青柳さん「誰のどのセミナーのどのテーマがどれぐらい受注や他のことにつながったのかも見れるようにしたい」）
  //   施策を 誰の（協業者）・テーマ・講演者・種類・PM でまとめる。テーマと講演者は「・」で分けて、それぞれに数える（1つの施策が2つに入る）
  const SEM_GROUPS = [['camp', '施策ごと'], ['partner', '誰の（協業者）'], ['theme', 'テーマ'], ['speaker', '講演者'], ['kind', '種類'], ['pm', 'PM']];
  function semGroupRows(seminars, k) {
    const split = k === 'theme' || k === 'speaker';
    const by = {};
    (seminars || []).forEach(s => {
      let raw = String(s[k] == null ? '' : s[k]).trim();
      if (k === 'pm') raw = raw.replace(/[（(].*?[）)]/g, '').trim();
      let keys = split ? raw.split(/[・、,，/／]+/).map(x => x.trim()).filter(Boolean) : [raw];
      keys = keys.filter((x, i, a) => x && a.indexOf(x) === i);
      if (!keys.length) keys = ['（空）'];
      keys.forEach(key => {
        const b = by[key] || (by[key] = { key: key, camps: 0, names: [], people: 0, apo: 0, sit: 0, valid: 0, won: 0, amount: 0, noPrice: 0 });
        b.camps++;
        b.names.push(s.name);
        ['people', 'apo', 'sit', 'valid', 'won', 'amount', 'noPrice'].forEach(f => { b[f] += Number(s[f]) || 0; });
      });
    });
    const r = (a, b) => (b ? a / b : '');
    return Object.keys(by).map(key => { const b = by[key]; return Object.assign(b, { apoRate: r(b.apo, b.people), validRate: r(b.valid, b.sit), winRate: r(b.won, b.apo), peopleWin: r(b.won, b.people), perPerson: b.people ? b.amount / b.people : '' }); })
      .sort((a, b) => b.won - a.won || b.amount - a.amount || b.apo - a.apo || b.people - a.people || a.key.localeCompare(b.key, 'ja'));
  }
  const AnalysisView = {
    mixins: [sortMixin],
    data() { const to = S.today.slice(0, 7); return { from: addMonthsYm(to, -2), to: to, tab: 'route', d: null, dd: null, metric: 'won', metrics: ANA_METRICS, sort: { key: '', dir: -1 }, semGroup: 'camp', semGroups: SEM_GROUPS }; },
    computed: {
      base() { return this.tab === 'detail' ? this.dd : this.d; },
      rows() { const b = this.base; if (!b) return []; return this.sort.key ? sortRows(b.rows, this.sort.key, this.sort.dir) : b.rows; },
      t() { return this.d ? this.d.total : null; },
      span() { return this.from === this.to ? ymLabel(this.from) : ymLabel(this.from) + '〜' + ymLabel(this.to); },
      // 【2026-11-18】目標との比較（青柳さん「目標と実績も必要だよね、それの比較も」）＝KPI目標タブの、営業の経路ごとの目標（期間の月を足す）
      // 期間のどの月にも目標があるときだけ比べる（目標の無い月の実績まで足すと、達成率が大きく見える）
      semRows() { return this.d && this.semGroup !== 'camp' ? semGroupRows(this.d.seminars, this.semGroup) : []; },
      semMax() { const z = { won: 1, amount: 1 }; this.semRows.forEach(x => { z.won = Math.max(z.won, x.won); z.amount = Math.max(z.amount, x.amount); }); return z; },
      semTotal() {
        const z = { camps: 0, people: 0, apo: 0, sit: 0, valid: 0, won: 0, amount: 0, noPrice: 0 };
        (this.d ? this.d.seminars : []).forEach(s => { z.camps++; ['people', 'apo', 'sit', 'valid', 'won', 'amount', 'noPrice'].forEach(f => { z[f] += Number(s[f]) || 0; }); });
        const r = (a, b) => (b ? a / b : '');
        return Object.assign(z, { apoRate: r(z.apo, z.people), validRate: r(z.valid, z.sit), winRate: r(z.won, z.apo), peopleWin: r(z.won, z.people) });
      },
      tgtMonths() { return this.d ? (this.d.targetMonths || []) : []; },
      tgtFull() { const p = this.d ? (this.d.periodMonths || []) : []; return p.length > 0 && p.every(m => this.tgtMonths.indexOf(m) >= 0); },
      tgt() { const t = this.t && this.t.target; return this.tgtFull && t && (t.apo !== '' || t.won !== '' || t.amount !== '') ? t : null; },
      hasTarget() { return this.tab === 'route' && !!this.tgt; },
      tgtNote() {
        if (!this.d || this.tgtFull) return '';
        if (!this.tgtMonths.length) return 'この期間には、営業のリード元ごとの目標が入っていません（目標の画面で入れると、ここで実績と比べられます）。';
        return '目標が入っているのは ' + this.tgtMonths.map(ymLabel).join('・') + ' だけです。目標と比べるときは、期間を目標のある月にしてください。';
      },
    },
    methods: {
      async load() { this.d = null; this.dd = null; this.d = await run('appAnalysis', this.from, this.to, 'route'); if (this.tab === 'detail') this.loadDetail(); },
      async loadDetail() { this.dd = await run('appAnalysis', this.from, this.to, 'detail'); },
      preset(n) { this.to = S.today.slice(0, 7); this.from = addMonthsYm(this.to, -(n - 1)); this.load(); },
      thisYear() { this.to = S.today.slice(0, 7); this.from = S.today.slice(0, 4) + '-01'; this.load(); },
      isPreset(n) { return this.to === S.today.slice(0, 7) && this.from === addMonthsYm(this.to, -(n - 1)); },
      show(t) { this.tab = t; this.sort = { key: '', dir: -1 }; if (t === 'detail' && !this.dd) this.loadDetail(); },
      r(v) { return v === '' || v == null ? '—' : pct(v); },
      reachC(v) { return v === '' || v == null ? '' : (v >= 1 ? 'ok' : (v >= 0.5 ? 'mid' : 'low')); },
      has(x, k) { return this.tgtFull && !!(x && x.target && x.target[k] !== '' && x.target[k] != null); },
      barW(v) { return Math.max(2, Math.round(Math.min(1, Number(v) || 0) * 50)) + 'px'; },   // 率の棒（100%＝50px）
      routeRow(k) { return this.d ? this.d.rows.filter(x => x.key === k)[0] : null; },
      fmtM(b, k) {
        if (!b) return '';
        const m = ANA_METRICS.filter(x => x[0] === k)[0];
        const v = b[k];
        if (m[2] === 'rate') return v === '' || v == null ? '—' : pct(v);
        if (m[2] === 'yen') return v ? yen(v) : '0';
        return v || 0;
      },
      sortBy(k) { if (this.sort.key === k) this.sort.dir = -this.sort.dir; else { this.sort.key = k; this.sort.dir = k === 'key' ? 1 : -1; } },
      openCamp(s) { ensure('camp').then(() => openPanel('camp', s.id)); },
      showTargetMonths() { const m = this.tgtMonths; if (!m.length) return; this.from = m[0]; this.to = m[m.length - 1]; this.load(); },
    },
    created() { this.load(); },

  const CountView = {
    mixins: [sortMixin],
    data() { return { day: S.today, d: null, q: '', sort: { key: 'name', dir: 1 } }; },
    computed: {
      rows() {
        const list = this.d ? this.d.rows.filter(r => textHit(r, ['name', 'state'], this.q)) : [];
        if (this.sort.key === 'use') return sortRows(list.map(r => ({ _v: this.useOf(r), r: r })), '_v', this.sort.dir).map(x => x.r);
        return sortRows(list, this.sort.key, this.sort.dir);
      },
      sum() {
        const z = { recv: 0, cap: 0, zero: 0, over: 0, soon: 0, done: 0, n: 0 };
        (this.d ? this.d.rows : []).forEach(r => {
          z.n++; z.recv += Number(r.recv) || 0; z.done += Number(r.done) || 0;
          if (r.plan !== '' && !isNaN(Number(r.plan))) z.cap += Number(r.plan);
          if (r.left === 0) z.zero++;
          if (typeof r.left === 'number' && r.left < 0) z.over++;
          if (typeof r.days === 'number' && r.days >= 0 && r.days <= 30) z.soon++;
        });
        return z;
      },
      chart() {
        const t = trimLead(this.d ? this.d.trend || [] : [], m => m.avatar + m.auto + m.done > 0, 4);
        return {
          labels: t.map(m => Number(m.month.slice(5)) + '月'),
          series: [
            { name: 'アバター（受付）', color: 'var(--series-1)', values: t.map(m => m.avatar) },
            { name: '自動編集（受付）', color: 'var(--series-2)', values: t.map(m => m.auto) },
            { name: '納品', type: 'line', color: 'var(--series-3)', values: t.map(m => m.done) },
          ],
        };
      },
    },
    methods: {
      async load() { this.d = await run('appMonthCounts', this.day); },
      openCust(name) { if (prodOnly()) return; ensure('cust').then(() => openPanel('cust', name)); },   // 「制作」だけの人は顧客の画面を開かない
      useOf(r) { const p = Number(r.plan); return r.plan === '' || isNaN(p) || !p ? '' : (Number(r.recv) || 0) / p; },
      barW(r) { const u = this.useOf(r); return u === '' ? '0%' : Math.min(100, Math.round(u * 100)) + '%'; },
      leftStyle(v) { return typeof v === 'number' ? (v < 0 ? 'background:var(--late-weak);color:var(--late);font-weight:700' : (v === 0 ? 'background:var(--warn-weak)' : '')) : ''; },
      daysStyle(v) { return typeof v === 'number' ? (v < 0 ? 'background:var(--late-weak);color:var(--late);font-weight:700' : (v <= 30 ? 'background:var(--warn-weak)' : '')) : ''; },
      sortBy(k) { if (this.sort.key === k) this.sort.dir = -this.sort.dir; else { this.sort.key = k; this.sort.dir = k === 'use' || k === 'recv' ? -1 : 1; } },
    },
    created() { this.load(); },
    activated() { if (takeDirty('count')) this.load(); },
    template: `
      <div class="page">
        <div class="page-head"><div><h1>月の本数</h1><p class="sub">今の期間（契約日から1か月ごと・繰り越しなし）に何本受け付けたかと、月ごとの本数</p></div>
          <div class="acts"><span class="muted small">見る日</span><input class="f" type="date" v-model="day" @change="load" aria-label="見る日"></div></div>
        <div v-if="!d" class="empty">読み込んでいます…</div>
        <template v-else>
          <div class="tiles">
            <div class="card tile"><div class="l">今の期間の受付（アバター）</div><div class="v">{{ sum.recv }}<small>本</small></div><div class="s">プランの本数の合計 {{ sum.cap }}本・納品済み {{ sum.done }}本</div></div>
            <div class="card tile" :class="{warn: sum.zero}"><div class="l">残りが0本</div><div class="v">{{ sum.zero }}<small>社</small></div><div class="s">次の期間まで受け付けられない</div></div>
            <div class="card tile" :class="{late: sum.over}"><div class="l">上限を超えて受付</div><div class="v">{{ sum.over }}<small>社</small></div><div class="s">お客様に確かめる</div></div>
            <div class="card tile" :class="{warn: sum.soon}"><div class="l">満了まで30日以内</div><div class="v">{{ sum.soon }}<small>社</small></div><div class="s">延長・解約の申し出を確かめる</div></div>
          </div>
          <div class="card chartcard">
            <h2>月ごとの本数</h2>
            <p class="cap">棒＝受け付けた本数（取消を除く・受付日の月）。線＝納品した本数（納品日の月）。なぞると数字が出ます</p>
            <trend-chart :labels="chart.labels" :series="chart.series" stacked unit="本" title="月ごとの本数"></trend-chart>
          </div>
          <div class="filters"><input class="f q" v-model="q" placeholder="顧客名で探す" aria-label="顧客名で探す">
            <span class="muted small">残りが0で黄・マイナスで赤（上限を超えて受け付けている）。満了まで30日を切ると黄</span></div>
          <div class="tblwrap"><table class="list">
            <thead><tr><th class="sort" @click="sortBy('name')">顧客名<span class="arrow">{{ arrow('name') }}</span></th><th>状態</th><th>期間</th>
              <th class="sort" @click="sortBy('use')">消化（受付 / プランの本数）<span class="arrow">{{ arrow('use') }}</span></th><th class="num">納品済み</th><th class="num sort" @click="sortBy('left')">残り<span class="arrow">{{ arrow('left') }}</span></th>
              <th class="num">自動編集の受付</th><th class="num">自動編集の残り</th><th>契約の終わり</th><th>解約の申し出期限</th><th class="num sort" @click="sortBy('days')">満了まで<span class="arrow">{{ arrow('days') }}</span></th></tr></thead>
            <tbody><tr v-for="r in rows" :key="r.name" :class="{click: !prodOnly()}" @click="openCust(r.name)">
              <td class="name">{{ r.name }}</td><td class="nowrap">{{ r.state }}</td><td class="nowrap small">{{ r.period }}</td>
              <td><div class="mtr" :class="{over: typeof r.left === 'number' && r.left < 0}" v-if="useOf(r) !== ''"><span class="trk"><i :style="{width: barW(r)}"></i></span><span class="fig">{{ r.recv }} / {{ r.plan }}本</span><span class="tag" v-if="typeof r.left === 'number' && r.left < 0">超過</span></div>
                <span v-else class="muted small">{{ r.plan === '無制限' ? r.recv + '本（無制限）' : (r.recv ? r.recv + '本' : '—') }}</span></td>
              <td class="num">{{ r.done }}</td><td class="num" :style="leftStyle(r.left)">{{ r.left }}</td>
              <td class="num">{{ r.recvAuto }}</td><td class="num" :style="leftStyle(r.leftAuto)">{{ r.leftAuto }}</td>
              <td class="nowrap">{{ mdy(r.end) }}</td><td class="nowrap">{{ mdy(r.deadline) }}</td><td class="num" :style="daysStyle(r.days)">{{ r.days === '' ? '' : r.days + '日' }}</td></tr></tbody>
          </table><div class="empty" v-if="!rows.length">当てはまるお客様はいません</div></div>
        </template>
      </div>`,
  };

  // ---------------------------------------------------------------- フォームの回答【2026-11-18 同日5回目】
  // 青柳さん「フォームの回答はリアルタイムで送信したら、連携されるのかな？」＝フォームを送ると、その場で台帳の「依頼」に1行入る（onFormSubmit）。
  //   この画面はその回答を依頼の行と並べて出す（開いているあいだ1分ごとに読み直す。見本の版は写しなので届かない）
  const FORM_TABS = [
    ['all', 'すべて', () => true],
    ['open', '進行中の依頼', x => x.reqId && ['納品済み', '取消'].indexOf(x.status) < 0],
    ['none', '依頼に入っていない', x => !x.reqId],
  ];
  const FormView = {
    data() { return { tab: 'all', q: '', sales: '', open: {}, limit: 60 }; },
    computed: {
      d() { return S.data.form; },
      base() { return (this.d ? this.d.reqs : []).filter(x => (!this.sales || x.sales === this.sales) && textHit(x, ['cust', 'theme', 'reqId', 'style', 'sales', 'make'], this.q)); },
      recs() { return (this.d ? this.d.recs : []).filter(x => textHit(x, ['reqId', 'memo'], this.q)); },
      tabs() { return FORM_TABS.map(t => [t[0], t[1], this.base.filter(t[2]).length]).concat([['rec', '録音フォーム', this.recs.length]]); },
      rows() { const t = FORM_TABS.filter(x => x[0] === this.tab)[0]; return t ? this.base.filter(t[2]) : []; },
      checked() { return hhmm(S.loadedAt.form); },
    },
    methods: {
      key(x) { return x.tab + '#' + x.row; },
      toggle(x) { this.open[this.key(x)] = !this.open[this.key(x)]; },
      openReq(id) { ensure('req').then(() => openPanel('req', id)).catch(() => {}); },
      parts(a) {   // 答えの中のリンク（添付・録音のファイル）は押せるようにする。http(s) だけ
        return String(a).split(/(https?:\/\/[^\s,、]+)/).filter(s => s !== '').map(s => ({ t: s, u: safeUrl(s) }));
      },
    },
    created() { loadForm().catch(() => {}); },
    activated() { if (!S.data.form || Date.now() - (S.loadedAt.form || 0) > 30000) loadForm(true).catch(() => {}); },
    template: `
      <div class="page">
        <div class="page-head"><div><h1>フォームの回答<span class="count" v-if="d">{{ d.total }}件</span></h1>
            <p class="sub">依頼フォームの回答を、台帳の依頼と並べて出します。フォームを送ると、その場で台帳の「依頼」に1行入ります（自動）。</p></div>
          <div class="acts"><span class="livechk" v-if="!MIHON && checked">1分ごとに確かめています（最後 {{ checked }}）</span>
            <a class="btn" v-if="safeUrl(S.formLink)" :href="safeUrl(S.formLink)" target="_blank" rel="noopener">依頼フォームを開く</a></div></div>
        <div class="note warn" v-if="MIHON">見本の版は {{ MIHON.made }} の写しです。いまフォームを送っても、ここには届きません（本番の画面なら1分以内に出ます）。</div>
        <view-tabs :tabs="tabs" v-model="tab"></view-tabs>
        <div class="filters">
          <select class="f" v-model="sales" aria-label="担当営業" v-if="tab !== 'rec'"><option value="">担当営業：全員</option><option v-for="p in S.lists['人']" :key="p" :value="p">{{ p }}</option></select>
          <input class="f q" v-model="q" placeholder="顧客・何の動画か・依頼IDで探す" aria-label="フォームの回答で探す"><span class="spin" v-if="!d"></span>
          <span class="muted small" v-if="d && d.unmatched">依頼に入っていない回答が {{ d.unmatched }}件（テストの送信・エラーで手で直した行など）</span>
        </div>
        <div v-if="!d" class="empty">読み込んでいます…</div>
        <div class="tblwrap" v-else-if="tab !== 'rec'"><table class="list">
          <thead><tr><th>送った日時</th><th>顧客</th><th>何の動画か</th><th>作り方</th><th>担当営業</th><th>依頼</th><th></th></tr></thead>
          <tbody>
            <template v-for="x in rows.slice(0, limit)" :key="key(x)">
              <tr class="click" @click="toggle(x)">
                <td class="nowrap small">{{ x.ts }}</td><td class="name">{{ x.cust || '（顧客名なし）' }}</td>
                <td style="min-width:200px">{{ x.theme }}<span class="sub muted small" v-if="x.style"><br>{{ x.style }}</span></td>
                <td class="nowrap small">{{ x.make }}</td><td class="nowrap">{{ x.sales }}</td>
                <td class="nowrap"><template v-if="x.reqId"><button class="lnk" @click.stop="openReq(x.reqId)">{{ x.reqId }}</button> <span class="pill" :class="'w-' + x.waiting" v-if="x.status">{{ x.status }}</span></template>
                  <span v-else class="pill" style="background:var(--warn-weak);color:var(--warn)">依頼に入っていない</span></td>
                <td><button class="exp" @click.stop="toggle(x)" :aria-expanded="!!open[key(x)]">{{ open[key(x)] ? '閉じる' : '中身' }}</button></td>
              </tr>
              <tr v-if="open[key(x)]" class="qa"><td colspan="7"><dl class="qa"><template v-for="(p, i) in x.qa" :key="i"><dt>{{ p[0] }}</dt>
                <dd><template v-for="(s, j) in parts(p[1])" :key="j"><a v-if="s.u" :href="s.u" target="_blank" rel="noopener">{{ s.t }}</a><template v-else>{{ s.t }}</template></template></dd></template></dl></td></tr>
            </template>
          </tbody>
        </table>
          <div class="empty" v-if="!rows.length">当てはまる回答はありません</div>
          <button class="more" v-if="rows.length > limit" @click="limit += 60">あと {{ rows.length - limit }}件</button>
        </div>
        <div class="tblwrap" v-else><table class="list">
          <thead><tr><th>送った日時</th><th>依頼</th><th>営業メモ</th><th>ファイル</th></tr></thead>
          <tbody><tr v-for="x in recs" :key="key(x)">
            <td class="nowrap small">{{ x.ts }}</td><td class="nowrap"><button class="lnk" v-if="x.reqId" @click="openReq(x.reqId)">{{ x.reqId }}</button></td>
            <td style="min-width:200px">{{ x.memo }}</td>
            <td><template v-for="(p, i) in x.qa.filter(q => /ファイル/.test(q[0]))" :key="i"><template v-for="(s, j) in parts(p[1])" :key="j"><a v-if="s.u" :href="s.u" target="_blank" rel="noopener">ファイル</a> </template></template></td>
          </tr></tbody>
        </table><div class="empty" v-if="!recs.length">録音フォームの回答はありません</div></div>
      </div>`,
  };

  // ---------------------------------------------------------------- 稼働・紹介（稼働と解約・顧客別の稼働・紹介）【2026-11-18 同日5回目：グラフを足した】
  // 青柳さん「制作面も充実させたい。稼働や紹介も可視化を」
  const REF_COLORS = { '紹介': 'var(--series-1)', 'セミナー・交流会': 'var(--series-2)', 'そのほか': 'var(--series-3)', 'リード元なし': 'var(--series-muted)' };
  const OpsView = {
    data() { return { tab: 'churn', churn: null, cfrom: '', cto: '', act: null, afrom: '', ato: '', ref: null, refOnly: false, heat: HEAT_STEPS }; },
    computed: {
      churnChart() {
        // 依頼が台帳に入り始める前の月（2026-09 より前）は0%に見えて誤解されるので、グラフでは落とす（表には出す）
        const rows = trimLead(this.churn ? this.churn.rows : [], r => Number(r.jobs) > 0, 3);
        return {
          labels: rows.map(r => Number(String(r.month).slice(5)) + '月'),
          series: [
            { name: '稼働率（依頼した社数 ÷ 社数）', type: 'line', color: 'var(--series-1)', values: rows.map(r => r.rate) },
            { name: '消化率（依頼本数 ÷ 本数の上限）', type: 'line', color: 'var(--series-2)', values: rows.map(r => r.use) },
          ],
        };
      },
      refChart() {
        const d = this.ref;
        if (!d) return { labels: [], series: [] };
        const mo = trimLead(d.monthly, m => d.groups.some(g => m[g] > 0), 4);
        return { labels: mo.map(m => Number(m.month.slice(5)) + '月'), series: d.groups.map(g => ({ name: g, color: REF_COLORS[g], values: mo.map(m => m[g]) })) };
      },
      refRows() { return this.ref ? this.ref.rows.filter(r => !this.refOnly || r.group === '紹介') : []; },
      refMax() { return Math.max(1, ...this.refRows.map(r => r.custs)); },
    },
    methods: {
      async loadChurn() { this.churn = await run('appChurn', this.cfrom, this.cto); this.cfrom = this.churn.from; this.cto = this.churn.to; },
      async loadAct() { this.act = await run('appCustomerActivity', this.afrom, this.ato); this.afrom = this.act.from; this.ato = this.act.to; },
      async loadRef() { this.ref = await run('appReferrals'); },
      show(t) { this.tab = t; if (t === 'churn' && !this.churn) this.loadChurn(); if (t === 'act' && !this.act) this.loadAct(); if (t === 'ref' && !this.ref) this.loadRef(); },
      cellStyle(v, r) { return heatStyle(v, r.cap); },
      rate(x) { return x === '' || x == null ? '—' : (Math.round(x * 1000) / 10) + '%'; },
      openCust(name) { ensure('cust').then(() => openPanel('cust', name)); },
      refColor(g) { return REF_COLORS[g] || 'var(--series-muted)'; },
      heatLabel(i) { return ['〜25%', '〜50%', '〜75%', '〜100%', 'プランより多い'][i]; },
    },
    created() { this.loadChurn(); },
    activated() { if (takeDirty('ops')) { this.churn = null; this.act = null; this.ref = null; this.show(this.tab); } },
    template: `
      <div class="page">

        <view-tabs :tabs="[['churn', '稼働（月ごと）'], ['act', '顧客別の稼働'], ['ref', '紹介']]" :modelValue="tab" @update:modelValue="show"></view-tabs>

              <h2>稼働率と消化率</h2>

              <trend-chart :labels="churnChart.labels" :series="churnChart.series" pct title="稼働率と消化率"></trend-chart>
            </div>
            <div class="tiles">
              <div class="card tile"><div class="l">アクティブ率 {{ churn.warn.days }}日</div><div class="v">{{ rate(churn.warn.rate) }}</div><div class="s">{{ churn.warn.active }}/{{ churn.warn.live }}社</div></div>
              <div class="card tile"><div class="l">アクティブ率 {{ churn.late.days }}日</div><div class="v">{{ rate(churn.late.rate) }}</div><div class="s">{{ churn.late.active }}/{{ churn.late.live }}社</div></div>
              <div class="card tile warn"><div class="l">{{ churn.warn.days }}日 依頼なし</div><div class="v">{{ churn.warn.idle }}<small>社</small></div><div class="s">声をかける</div></div>
              <div class="card tile late"><div class="l">{{ churn.late.days }}日 依頼なし</div><div class="v">{{ churn.late.idle }}<small>社</small></div><div class="s">解約の予兆</div></div>
            </div>

            <p class="muted small" style="margin:0 0 10px">解約率の分母＝4か月目以降に入った社数（3か月はマスト）。継続率＝3か月マストの満了を迎えた社数のうち続いた割合。消化率＝依頼本数 ÷ 本数の上限。先の月は出しません。</p>
            <div class="tblwrap"><table class="list">
              <thead><tr><th>月</th><th class="num">社数</th><th class="num">新規</th><th class="num">終了</th><th class="num">解約できる</th><th class="num">解約率</th><th class="num">満了した社数</th><th class="num">続いた社数</th><th class="num">継続率</th><th class="num">依頼本数</th><th class="num">本数の上限</th><th class="num">消化率</th><th class="num">依頼した社数</th><th class="num">稼働率</th><th style="min-width:200px">メモ</th></tr></thead>
              <tbody><tr v-for="r in churn.rows" :key="r.month" :class="{now: r.now}">
                <td class="nowrap"><b>{{ r.month }}</b></td><td class="num">{{ r.live }}</td><td class="num">{{ r.isNew }}</td><td class="num">{{ r.ended }}</td><td class="num">{{ r.cancelable }}</td>

                <td class="num">{{ r.jobs }}</td><td class="num">{{ r.cap }}</td><td class="num">{{ rate(r.use) }}</td><td class="num">{{ r.active }}</td><td class="num" :style="r.rate !== '' && r.rate < 0.7 ? 'background:var(--warn-weak)' : ''">{{ rate(r.rate) }}</td><td class="muted small">{{ r.note }}</td></tr></tbody>
            </table></div>
          </template>
        </template>
        <template v-if="tab === 'act'">
          <div class="filters"><input class="f" type="month" v-model="afrom" aria-label="から"><span class="muted">〜</span><input class="f" type="month" v-model="ato" aria-label="まで"><button class="btn" @click="loadAct">出す</button></div>
          <p class="muted small" style="margin:0 0 6px">マスの数字＝その月に受け付けた依頼の本数。空欄＝その月は契約していない。平均消化率の低い順（気にかける順）。</p>
          <div class="heatlg" aria-label="マスの色"><span><i style="background:var(--late-weak);outline:1px solid var(--late)"></i>0本（依頼なし）</span>
            <span v-for="(h, i) in heat" :key="i"><i :style="{background: h[1]}"></i>{{ heatLabel(i) }}</span><span>（その月の本数 ÷ プランの本数。濃いほどプランに近い）</span></div>
          <div v-if="!act" class="empty">読み込んでいます…</div>

  const LoginView = {
    data() { return { k: '' }; },
    // 【2026-11-20】Apps Script の外に置いたのに、つなぎ先が入っていない（画面.html をそのまま置いた）
    computed: { noApi() { return !inGas() && !API_URL; } },
    methods: { go() { const v = this.k.trim(); if (v.length < 20) { toast('合言葉が短すぎます。リンクの #k= のうしろを全部貼ってください', 'error'); return; } lsSet(v); this.$root.boot(); } },
    template: `
      <div class="card login">
        <h1>Avatifi 管理</h1>
        <div class="note warn" v-if="noApi">この画面には、つなぎ先（Apps Script のウェブアプリの URL）が入っていないので開けません。
          Netlify などに置くときは、<b>依頼管理/Netlify用の画面を作る.js</b> で作った index.html だけを置いてください。</div>
        <p>このシステムは、青柳さんから届いた<b>自分専用のリンク</b>から開きます。リンクから開くと、この端末に合言葉が覚えられ、次からはこのページだけで開けます。</p>
        <p style="font-size:13px">リンクが開けないときは、リンクの <code>#k=</code> のうしろ（64文字）をここに貼ってください。</p>
        <input class="f" v-model="k" placeholder="合言葉" @keyup.enter="go" aria-label="合言葉">
        <button class="btn primary" @click="go">開く</button>
      </div>`,
  };

  // ---------------------------------------------------------------- 全体
  const NAV = [
    { g: '', items: [['home', 'ホーム', '⌂'], ['task', 'タスク', '☑']] },
    // 【2026-11-19】施策を「セミナー」「交流会」に分けて代理店の下に（「その他の施策」は、ほかの種類の施策があるときだけ出す）
    // 【2026-11-23】名刺（名刺交換しただけの人のリスト。写真から入れる）を交流会の下に
    { g: '営業', items: [['deal', '商談', '◎'], ['agency', '代理店', '⇄'], ['sem', 'セミナー', '✦'], ['mix', '交流会', '◇'], ['card', '名刺', '▭'], ['camp', 'その他の施策', '…']] },
    // 【2026-11-18 同日5回目】制作の側に 月の本数・フォームの回答・稼働と紹介 を並べた（青柳さん「制作側だが、月の本数とフォームの回答があった方がいい」）
    { g: '顧客と制作', items: [['cust', '顧客', '☺'], ['req', '制作（依頼）', '▶'], ['count', '月の本数', '▦'], ['form', 'フォームの回答', '✉'], ['ops', '稼働・紹介', '◷']] },
    { g: 'お金', items: [['money', '売上', '¥'], ['pay', '入金', '↘'], ['fee', '代理店フィー', '％']] },
    { g: '目標', items: [['goal', '目標（KGI・KPI）', '▲'], ['analysis', '分析', '▤']] },
  ];
  // 【2026-11-19】「制作」だけの人が開ける画面
  const PROD_VIEWS = ['req', 'count', 'form'];
  const NAV_ALL = {};
  NAV.forEach(x => x.items.forEach(i => { NAV_ALL[i[0]] = i; }));
  const VIEWS = { home: 'home-view', task: 'tasks-view', deal: 'deals-view', camp: 'camps-view', sem: 'camps-view', mix: 'camps-view', card: 'cards-view', agency: 'agencies-view', cust: 'custs-view', req: 'reqs-view', count: 'count-view', form: 'form-view', ops: 'ops-view', money: 'money-view', pay: 'pays-view', fee: 'fee-view', goal: 'goal-view', analysis: 'analysis-view', settings: 'settings-view' };
  const App = {
    data() { return { q: '', showRes: false, createMenu: false }; },
    computed: {
      // 【2026-11-19 レビュー】代理店フィーは管理の人だけ（青柳さん決定）
      // 【2026-11-19】役割が「制作」だけの人は制作の3つだけ（青柳さん「坂口もいれといて。見れるのは制作のとこのみ」）
      nav() {
        if (prodOnly()) return [{ g: '制作', items: PROD_VIEWS.map(v => NAV_ALL[v]) }];
        const otherCamps = (S.data.camp || []).some(c => campGroup(c) === 'camp');
        const n = NAV.map(x => ({ g: x.g, items: x.items.filter(i => (i[0] !== 'fee' || isAdmin()) && (i[0] !== 'camp' || otherCamps)) }));
        if (isAdmin()) n.push({ g: '', items: [['settings', '設定', '⚙']] });
        return n;
      },
      flat() { return [].concat.apply([], this.nav.map(x => x.items)); },
      bottom() { return prodOnly() ? PROD_VIEWS.map(v => NAV_ALL[v]) : [['home', 'ホーム', '⌂'], ['task', 'タスク', '☑'], ['deal', '商談', '◎'], ['cust', '顧客', '☺'], ['req', '制作', '▶']]; },
      // 出す画面の名前（「制作」だけの人が制作のほかを開こうとしたら制作（依頼））。keep-alive の印もこれにする（前に開いた画面を使い回さない）
      viewKey() { return prodOnly() && PROD_VIEWS.indexOf(S.view) < 0 ? 'req' : S.view; },
      viewComp() { return VIEWS[this.viewKey] || null; },
      results() {
        const q = this.q.trim();
        if (!q) return [];
        const out = [];
        (S.data.cust || []).forEach(c => { if (textHit(c, ['name', 'company', 'email'], q)) out.push({ k: '顧客', t: c.name, s: c.company || c.service || '', kind: 'cust', key: c.name }); });
        (S.data.deal || []).forEach(d => { if (textHit(d, ['name', 'company', 'email'], q)) out.push({ k: '商談', t: sama(d.name), s: (d.company || '') + '　' + d.stage, kind: 'deal', key: d.id }); });
        (S.data.camp || []).forEach(c => { if (textHit(c, ['name', 'theme'], q)) out.push({ k: '施策', t: campLabel(c.name), s: mdy(c.date), kind: 'camp', key: c.id }); });
        (S.data.agency || []).forEach(a => { if (textHit(a, ['name', 'owner'], q)) out.push({ k: '代理店', t: sama(a.name), s: a.kind || '', kind: 'agency', key: a.name }); });
        (S.data.req || []).forEach(r => { if (textHit(r, ['id', 'theme'], q)) out.push({ k: '依頼', t: r.id, s: r.theme || '', kind: 'req', key: r.id }); });
        return out.slice(0, 30);
      },
    },
    methods: {
      go(v) {
        S.scroll[S.view] = window.scrollY;
        S.view = v;
        S.sheet = false;
        nextTick(() => window.scrollTo(0, S.scroll[v] || 0));
      },
      pick(r) { this.showRes = false; this.q = ''; openPanel(r.kind, r.key); },
      focusSearch() { this.showRes = true; ['cust', 'deal', 'camp', 'agency', 'req'].forEach(k => { if (!S.data[k]) ensure(k).catch(() => {}); }); },
      blurSearch() { setTimeout(() => { this.showRes = false; }, 200); },
      create(kind) {
        this.createMenu = false;
        // 【2026-11-19】セミナー・交流会は種類を入れた状態で開く
        if (kind === 'sem' || kind === 'mix') { S.create = { kind: 'camp', title: CAMP_GROUPS[kind].label + 'を追加する', preset: { kind: CAMP_GROUPS[kind].make } }; return; }
        S.create = { kind: kind };
      },
      logout() { ask('この端末から外しますか？', '合言葉を消します。次はまた専用リンクから開きます。', '外す', true).then(ok => { if (!ok) return; lsSet(''); S.key = ''; S.user = null; S.view = 'login'; }); },
      async boot() {
        let k = lsGet();
        const fromHash = await readHashKey();
        if (fromHash) { k = fromHash; lsSet(k); clearHash(); }
        if (!k) { S.view = 'login'; return; }
        S.key = k;
        try {
          const b = await run('appBoot');
          // 【2026-11-20】青柳さん「経路じゃなくてリード元って言葉にして」＝画面に出す項目名だけ言い換える（台帳の見出し・設定の名前「経路」は変えない）
          S.user = b.user; S.lists = b.lists; S.fields = uiFields(b.fields); S.stages = b.stages || STAGES; S.cats = b.cats; S.today = b.today;
          S.lists['段階'] = STAGES.slice();
          S.formLink = b.formLink; S.ledgerUrl = b.ledgerUrl; S.options = b.options;
          // 【2026-11-19】「制作」だけの人は 制作（依頼）から開き、依頼だけ読む
          if (b.user && b.user.prodOnly) { S.view = 'req'; S.booted = true; ensure('req').catch(() => {}); return; }
          S.view = 'home'; S.booted = true;
          ['cust', 'deal', 'camp', 'agency'].forEach(x => ensure(x).catch(() => {}));
        } catch (e) { S.view = 'login'; }
      },
    },
    mounted() { this.boot(); document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.panel && !S.confirm) closePanel(); }); },
    template: `
      <div>
        <login-view v-if="S.view === 'login'"></login-view>
        <div v-else-if="S.view === 'boot'" class="empty" style="padding:40px">開いています…</div>
        <div v-else class="shell">
          <nav class="nav" aria-label="メニュー">
            <div class="brand"><span class="logo">A</span><span>Avatifi 管理<small>商談から入金・制作まで</small></span></div>
            <div class="navgrp" v-for="(grp, gi) in nav" :key="gi">
              <h6 v-if="grp.g">{{ grp.g }}</h6>
              <button v-for="n in grp.items" :key="n[0]" :class="{on: S.view === n[0]}" @click="go(n[0])"><span class="ico" aria-hidden="true">{{ n[2] }}</span>{{ n[1] }}</button>
            </div>
            <div class="nav-foot">
              <a v-if="safeUrl(S.ledgerUrl)" :href="safeUrl(S.ledgerUrl)" target="_blank" rel="noopener">スプレッドシート（台帳）を開く ↗</a>
              <div style="margin-top:8px"><b>{{ S.user.name }}</b>　{{ S.user.roles.join('・') || '役割なし' }}</div>
              <a v-if="!MIHON" href="#" @click.prevent="logout">この端末から外す</a>
              <span v-else>見本の版（{{ MIHON.made }} の写し）</span>
            </div>
          </nav>
          <div class="main">
            <header class="topbar">
              <div class="gsearch" v-if="!prodOnly()"><span class="mag" aria-hidden="true">⌕</span>
                <input v-model="q" @focus="focusSearch" @input="showRes = true" @blur="blurSearch" placeholder="顧客・商談・施策・代理店・依頼を探す" aria-label="全部から探す">
                <div class="res" v-if="showRes && results.length"><button v-for="(r, i) in results" :key="i" @mousedown.prevent="pick(r)"><span class="k">{{ r.k }}</span><b>{{ r.t }}</b><span class="muted small">{{ r.s }}</span></button></div>
              </div>
              <div class="gsearch" v-else><span class="muted small">制作の役割（依頼・月の本数・フォームの回答だけ）</span></div>
              <span class="rel" v-if="!prodOnly()"><button class="btn primary make" @click.stop="createMenu = !createMenu">＋<span class="hide-sm"> 追加する</span></button>
                <div class="menu" v-if="createMenu" style="right:0;top:40px" @click.stop>
                  <button @click="create('deal')">リード（商談）</button><button @click="create('sem')">セミナー</button><button @click="create('mix')">交流会</button><button @click="createMenu = false; go('card')">名刺（写真から）</button><button @click="create('agency')">代理店</button><button @click="create('cust')">顧客（商談の無い契約）</button><button @click="create('pay')">入金（手で足す）</button><button @click="createMenu = false; addPerson()">人（担当者）</button>
                </div></span>
              <span class="mihon" v-if="MIHON" :title="'見本の版・' + MIHON.made + ' の写し（ここで直しても台帳には入りません）'"><span class="hide-sm">見本の版・{{ MIHON.made }} の写し</span><span class="show-sm">見本</span></span>
              <span class="spin" v-if="S.loading > 0" aria-label="読み込み中"></span>
              <span class="who hide-sm">{{ S.user.name }}</span>
            </header>
            <keep-alive><component :is="viewComp" :key="viewKey"></component></keep-alive>
          </div>
          <nav class="bottomnav" aria-label="メニュー">
            <button v-for="n in bottom" :key="n[0]" :class="{on: S.view === n[0]}" @click="go(n[0])"><span class="ico">{{ n[2] }}</span>{{ n[1] }}</button>
            <button :class="{on: S.sheet}" @click="S.sheet = !S.sheet"><span class="ico">…</span>ほか</button>
          </nav>
          <div v-if="S.sheet" class="overlay" @click="S.sheet = false"></div>
          <div v-if="S.sheet" class="sheet"><button v-for="n in flat" :key="n[0]" @click="go(n[0])"><span class="ico">{{ n[2] }}</span>{{ n[1] }}</button></div>
        </div>
        <record-panel></record-panel>
        <create-dialog></create-dialog>
        <win-dialog></win-dialog>
        <person-dialog></person-dialog>
        <task-dialog></task-dialog>
        <confirm-dialog></confirm-dialog>
        <div class="toasts" aria-live="polite"><div v-for="t in S.toasts" :key="t.id" class="toast" :class="t.kind">{{ t.msg }}</div></div>
      </div>`,
  };

  // URL の #k=合言葉 を読む（Apps Script の画面は iframe の中なので、google.script.url から読む）
  function readHashKey() {
    // 【2026-11-20】Apps Script の外（Netlify）では、ふつうに自分の URL の # を読む
    if (!inGas()) { const m = String(location.hash || '').replace(/^#/, '').match(/(?:^|&)k=([A-Za-z0-9-]+)/); return Promise.resolve(m ? m[1] : ''); }
    return new Promise(resolve => {
      try {
        google.script.url.getLocation(loc => {
          const h = String((loc && loc.hash) || '');
          const m = h.match(/(?:^|&)k=([A-Za-z0-9-]+)/);
          resolve(m ? m[1] : '');
        });
      } catch (e) { resolve(''); }
    });
  }
  function clearHash() {
    // 合言葉を URL に残さない（履歴・ブックマークに残らないように）
    if (!inGas()) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 消せなくても動く */ } return; }
    try { google.script.history.replace(null, {}, ''); } catch (e) { /* 消せなくても動く */ }
  }

  const app = createApp(App);
  Object.assign(app.config.globalProperties, Object.assign({}, G, { S: S, KIND_LABEL: KIND_LABEL, KGI_M: KGI_M, KPI_M: KPI_M, openPanel: openPanel, ensure: ensure, ADD_PERSON: ADD_PERSON, addPerson: addPerson, addTask: addTask,
    idleLevel: idleLevel, idleDays: idleDays }));   // 【2026-11-19】依頼なしの色（顧客の一覧と詳しい画面）
  [['prop-field', PropField], ['view-tabs', ViewTabs], ['confirm-dialog', ConfirmDialog], ['create-dialog', CreateDialog], ['win-dialog', WinDialog], ['person-dialog', PersonDialog], ['record-panel', RecordPanel],
    ['home-view', HomeView], ['deals-view', DealsView], ['camps-view', CampsView], ['agencies-view', AgenciesView], ['custs-view', CustsView], ['reqs-view', ReqsView],
    ['count-view', CountView], ['form-view', FormView], ['trend-chart', TrendChart], ['tasks-view', TasksView], ['task-dialog', TaskDialog],
    ['pays-view', PaysView], ['money-view', MoneyView], ['fee-view', FeeView], ['goal-view', GoalView], ['analysis-view', AnalysisView], ['ops-view', OpsView], ['settings-view', SettingsView], ['login-view', LoginView],
    ['cards-view', CardsView]]   // 【2026-11-23】名刺リスト
    .forEach(x => app.component(x[0], x[1]));
  app.config.errorHandler = (err) => { console.error(err); toast('画面で問題が起きました：' + (err && err.message ? err.message : err), 'error'); };
  const root = app.mount('#app');
  document.addEventListener('click', () => { const r = app._instance && app._instance.proxy; if (r && r.createMenu) r.createMenu = false; });
  // 【2026-11-20】Netlify では、開いたままのタブに専用リンクを貼ると「#k=…」だけが変わる（読み込み直さない）＝そのときも合言葉を読んで開き直す
  //   （app._instance は Vue の本番の版では空＝mount が返す画面の本体を使う）
  window.addEventListener('hashchange', () => {
    if (inGas() || !/(?:^|[#&])k=/.test(location.hash)) return;
    if (root && root.boot) root.boot();
  });
})();
</script>
</body>
</html>
